name: Verify (manual dispatch — run checks locally before pushing to main)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Verify the same history-derived chapter dates that production builds.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test tests/*.test.mjs
      - run: npm run build
