name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test tests/*.test.mjs
      - run: npm run build
        env:
          # PostHog analytics — baked into the client bundle at build time.
          # Repo secret PUBLIC_POSTHOG_KEY (and optional PUBLIC_POSTHOG_HOST).
          # Absent secret = empty value = palette analytics stay dark.
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Cap the retry ladder: deploy-pages polls up to 10 min per attempt,
    # so an uncapped hang-style outage would run ~33 min before failing.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      # The Pages backend intermittently rejects deployments with
      # "Deployment failed, try again later" (~45% of pushes since 2026-07-03).
      # deploy-pages does not retry a failed deployment (error_count only
      # covers status-poll errors), so retry the whole step with backoff.
      # All three attempts failing still fails the job — real outages stay loud.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 120
      - id: retry2
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v5

  # Announce the deployed corpus to IndexNow (Bing/Brave/Yandex ingestion —
  # the indexes ChatGPT and Claude search retrieve from). Runs after deploy,
  # so a failure here never blocks the site; red job = visible signal only.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/indexnow-ping.py
