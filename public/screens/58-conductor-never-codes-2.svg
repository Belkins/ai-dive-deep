  <text x="805.4" y="326.0" fill="#F4F1EA" font-size="22" font-weight="600" text-anchor="start">334</text>
  <text x="314.0" y="376.0" fill="#F4F1EA" font-size="23" font-weight="400" text-anchor="end">leak-guard</text>
