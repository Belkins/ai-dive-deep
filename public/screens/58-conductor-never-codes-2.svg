  <text x="220.8" y="484.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start" stroke="#0E0F11" stroke-width="6" stroke-linejoin="round" paint-order="stroke">build and fix</text>
  <text x="314.0" y="520.0" fill="#F4F1EA" font-size="23" font-weight="400" text-anchor="end">build</text>
