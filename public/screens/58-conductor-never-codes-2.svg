  <text x="1440.0" y="756.0" fill="#9A9789" font-size="19" font-weight="400" text-anchor="middle">800</text>
  <text x="80" y="168" fill="#9A9789" font-size="26">1,353 checker starts against 337 build starts: four checkers for every builder.</text>
  <text x="80.0" y="240.0" fill="#22D3A0" font-size="20" font-weight="700" text-anchor="start" letter-spacing="1" stroke="#0E0F11" stroke-width="6" stroke-linejoin="round" paint-order="stroke">CHECKERS</text>
  <text x="220.8" y="240.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start" stroke="#0E0F11" stroke-width="6" stroke-linejoin="round" paint-order="stroke">verify, refute, leak-guard and security: 1,353 starts</text>
  <text x="314.0" y="276.0" fill="#F4F1EA" font-size="23" font-weight="400" text-anchor="end">verify</text>
