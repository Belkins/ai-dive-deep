  <text x="607.5" y="756.0" fill="#9A9789" font-size="19" font-weight="400" text-anchor="middle">200</text>
  <line x1="885.0" y1="250" x2="885.0" y2="728" stroke="#3A3933" stroke-width="1"/>
  <text x="885.0" y="756.0" fill="#9A9789" font-size="19" font-weight="400" text-anchor="middle">400</text>
  <line x1="1162.5" y1="250" x2="1162.5" y2="728" stroke="#3A3933" stroke-width="1"/>
