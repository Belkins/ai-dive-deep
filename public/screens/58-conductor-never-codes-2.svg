  <text x="809.6" y="520.0" fill="#F4F1EA" font-size="22" font-weight="600" text-anchor="start">337</text>
  <text x="314.0" y="570.0" fill="#F4F1EA" font-size="23" font-weight="400" text-anchor="end">fix</text>
  <path d="M330.0,548.0 H510.5 Q514.5,548.0 514.5,552.0 V574.0 Q514.5,578.0 510.5,578.0 H330.0 Z" fill="#FF6B2C"/>
  <text x="526.5" y="570.0" fill="#F4F1EA" font-size="22" font-weight="600" text-anchor="start">133</text>
  <text x="80.0" y="628.0" fill="#C9C3B3" font-size="20" font-weight="700" text-anchor="start" letter-spacing="1" stroke="#0E0F11" stroke-width="6" stroke-linejoin="round" paint-order="stroke">PLUMBING</text>
  <text x="220.8" y="628.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start" stroke="#0E0F11" stroke-width="6" stroke-linejoin="round" paint-order="stroke">sync and merge agents are plumbing, not checkers</text>
  <text x="314.0" y="664.0" fill="#C9C3B3" font-size="23" font-weight="400" text-anchor="end">sync</text>
  <path d="M330.0,642.0 H1436.0 Q1440.0,642.0 1440.0,646.0 V668.0 Q1440.0,672.0 1436.0,672.0 H330.0 Z" fill="#6E6B61"/>
  <text x="1452.0" y="664.0" fill="#F4F1EA" font-size="22" font-weight="600" text-anchor="start">800</text>
  <text x="314.0" y="714.0" fill="#C9C3B3" font-size="23" font-weight="400" text-anchor="end">merge</text>
  <path d="M330.0,692.0 H664.5 Q668.5,692.0 668.5,696.0 V718.0 Q668.5,722.0 664.5,722.0 H330.0 Z" fill="#6E6B61"/>
  <text x="680.5" y="714.0" fill="#F4F1EA" font-size="22" font-weight="600" text-anchor="start">244</text>
  <text x="80.0" y="844.0" fill="#9A9789" font-size="19" font-weight="400" text-anchor="start">Eight labels shown; they account for 2,867 of the 3,021 starts.</text>
  <text x="80.0" y="872.0" fill="#9A9789" font-size="19" font-weight="400" text-anchor="start">Linear scale, agent starts. Read from the workflow journals by the first word of each agent label; snapshot 12 October 2026.</text>
</svg>
