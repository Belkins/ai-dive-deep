      .pill-tx { fill: #FAFAF7; font-size: 18px; font-weight: 500; }
      .tier-letter { font-family: "Source Serif 4", Georgia, serif; font-weight: 500; font-size: 68px; fill: #0E0F11; }
      .tier-crit-eyebrow { fill: #FAFAF7; font-size: 10px; letter-spacing: 1.4px; font-weight: 600; }
