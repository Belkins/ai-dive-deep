<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <!-- Background -->
  <rect width="1600" height="900" fill="#0E0F11"/>

  <!-- Header -->
  <text x="80" y="80" fill="#FF6B2C" font-size="16" letter-spacing="6" font-weight="500">CHAPTER 24 · VLAD'S TIER LIST · MAY 2026</text>
  <text x="80" y="146" fill="#FAFAF7" font-size="54" font-weight="500" font-family="Source Serif 4, Georgia, serif" letter-spacing="-1.2">The tier list. Without mercy.</text>
  <text x="80" y="184" fill="#AAA79A" font-size="19">Tools I'd actually miss if you took them away. Operator ranking, not benchmark ranking.</text>

