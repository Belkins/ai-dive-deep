<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#195EE6"/></marker>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0E0F11"/>

  <!-- header -->
  <text x="80" y="62" fill="#FF6B2C" font-size="15" letter-spacing="6" font-weight="500">CHAPTER 43 · NAME THE PRODUCT IN ONE SENTENCE</text>
  <text x="80" y="120" fill="#FAFAF7" font-size="50" font-weight="500" font-family="Source Serif 4, Georgia, serif" letter-spacing="-1">Seven surfaces become one promise</text>
  <text x="80" y="156" fill="#AAA79A" font-size="18">The old homepage felt like a separate neon AI product. The new one is a Folderly-light page with one usable generator in the first viewport.</text>

  <!-- BEFORE panel (dark/neon) -->
  <g transform="translate(70, 220)">
    <rect x="0" y="0" width="640" height="600" fill="#141019" stroke="#3A2A4D" stroke-width="1.5" rx="14"/>
    <text x="32" y="48" fill="url(#neon)" font-size="13" letter-spacing="3" font-weight="700">BEFORE — "AN AI WRITING PLATFORM"</text>
    <text x="32" y="78" fill="#8A7CA8" font-size="14">too much product at once; separate from Folderly</text>
    <g font-size="16" fill="#E5E5E5">
      <g transform="translate(32,108)"><rect width="576" height="46" rx="8" fill="#1E1726" stroke="#3A2A4D"/><text x="20" y="30">AI writing surface · credits · history · save</text></g>
      <g transform="translate(32,166)"><rect width="576" height="46" rx="8" fill="#1E1726" stroke="#3A2A4D"/><text x="20" y="30">Template library</text></g>
      <g transform="translate(32,224)"><rect width="576" height="46" rx="8" fill="#1E1726" stroke="#3A2A4D"/><text x="20" y="30">SEO machine — hundreds of bespoke pages</text></g>
      <g transform="translate(32,282)"><rect width="576" height="46" rx="8" fill="#1E1726" stroke="#3A2A4D"/><text x="20" y="30">Account dashboard · performance · personalization</text></g>
      <g transform="translate(32,340)"><rect width="576" height="46" rx="8" fill="#1E1726" stroke="#3A2A4D"/><text x="20" y="30">Sequence tool · team management</text></g>
      <g transform="translate(32,398)"><rect width="576" height="46" rx="8" fill="#1E1726" stroke="#3A2A4D"/><text x="20" y="30">Integration hub</text></g>
      <g transform="translate(32,456)"><rect width="576" height="46" rx="8" fill="#1E1726" stroke="#3A2A4D"/><text x="20" y="30">Experimental AI SDR system</text></g>
    </g>
    <text x="32" y="552" fill="#FF6B6B" font-size="15" font-weight="600">7 surfaces · one route doing all the jobs</text>
  </g>

  <!-- arrow -->
  <g transform="translate(740, 520)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#195EE6" stroke-width="3" marker-end="url(#ar2)"/>
    <text x="40" y="-18" fill="#195EE6" font-size="13" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace">simplify</text>
  </g>

  <!-- AFTER panel (Folderly-light) -->
  <g transform="translate(890, 220)">
    <rect x="0" y="0" width="640" height="600" fill="#FCFCFD" stroke="#EAEDF6" stroke-width="1.5" rx="14"/>
    <text x="32" y="48" fill="#195EE6" font-size="13" letter-spacing="3" font-weight="700" font-family="Plus Jakarta Sans, Inter, sans-serif">AFTER — ONE GENERATOR, ONE PROMISE</text>
    <text x="32" y="80" fill="#101828" font-size="24" font-weight="700" font-family="Plus Jakarta Sans, Inter, sans-serif">Generate cold emails built</text>
    <text x="32" y="110" fill="#101828" font-size="24" font-weight="700" font-family="Plus Jakarta Sans, Inter, sans-serif">for inbox placement.</text>
    <!-- generator card -->
    <g transform="translate(32, 140)">
      <rect width="576" height="330" rx="12" fill="#FFFFFF" stroke="#EAEDF6" stroke-width="1.5"/>
      <g transform="translate(28,40)">
        <text y="0" fill="#5B6171" font-size="14" font-weight="600">What do you offer?</text>
        <rect y="14" width="520" height="42" rx="8" fill="#F8F9FC" stroke="#EAEDF6"/>
        <text y="92" fill="#5B6171" font-size="14" font-weight="600">Who is it for?</text>
        <rect y="106" width="520" height="42" rx="8" fill="#F8F9FC" stroke="#EAEDF6"/>
        <text y="184" fill="#5B6171" font-size="14" font-weight="600">What should happen next?</text>
        <rect y="198" width="520" height="42" rx="8" fill="#F8F9FC" stroke="#EAEDF6"/>
        <rect y="262" width="200" height="46" rx="8" fill="#195EE6"/>
        <text x="100" y="291" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">Generate</text>
        <text x="240" y="291" fill="#8A91A4" font-size="13">defaults: professional · single email · deliverability-aware</text>
      </g>
    </g>
    <text x="32" y="500" fill="#00994C" font-size="15" font-weight="600">advanced actions moved behind sign-in</text>
  </g>

  <text x="80" y="868" fill="#71717A" font-size="13">Power features are not bad — they are bad when shown before the user has context. Save, history, templates, billing moved into the workspace.</text>
</svg>
