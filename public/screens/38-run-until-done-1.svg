<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>

  <!-- Title -->
  <text x="80" y="100" fill="#FF6B2C" font-size="18" letter-spacing="6" font-weight="500">THE AUTONOMY LADDER</text>
  <text x="80" y="170" fill="#FAFAF7" font-size="56" font-weight="500" font-family="Source Serif 4, Georgia, serif" letter-spacing="-1">Plan → Auto → /goal</text>
  <text x="80" y="215" fill="#AAA79A" font-size="20">each rung removes a class of operator approval</text>

  <!-- Rungs -->
  <!-- Rung 1: Plan mode -->
  <g transform="translate(80, 280)">
    <rect x="0" y="0" width="1440" height="100" fill="#161B1F" stroke="#26251F" stroke-width="1" rx="10"/>
    <rect x="0" y="0" width="6" height="100" fill="#56544B"/>
    <text x="40" y="38" fill="#71717A" font-size="14" letter-spacing="2">RUNG 1</text>
    <text x="40" y="78" fill="#FAFAF7" font-size="32" font-weight="500" font-family="Source Serif 4, Georgia, serif">Plan mode</text>
    <text x="780" y="46" fill="#AAA79A" font-size="18">Operator approves: every step before it runs</text>
    <text x="780" y="80" fill="#71717A" font-size="14" font-style="italic">show me the work before doing it</text>
  </g>

  <!-- Arrow down 1 -->
  <text x="120" y="420" fill="#FF8E54" font-size="24">↓</text>

  <!-- Rung 2: Auto mode -->
  <g transform="translate(80, 440)">
    <rect x="0" y="0" width="1440" height="100" fill="#161B1F" stroke="#26251F" stroke-width="1" rx="10"/>
    <rect x="0" y="0" width="6" height="100" fill="#FF8E54"/>
    <text x="40" y="38" fill="#FF8E54" font-size="14" letter-spacing="2">RUNG 2</text>
    <text x="40" y="78" fill="#FAFAF7" font-size="32" font-weight="500" font-family="Source Serif 4, Georgia, serif">Auto mode</text>
    <text x="780" y="46" fill="#AAA79A" font-size="18">Operator approves: tool by tool</text>
    <text x="780" y="80" fill="#71717A" font-size="14" font-style="italic">do the work, ask before each tool</text>
  </g>

  <!-- Arrow down 2 -->
  <text x="120" y="580" fill="#FF6B2C" font-size="24">↓</text>

  <!-- Rung 3: /goal -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1440" height="140" fill="#1A1B1F" stroke="#FF6B2C" stroke-width="2" rx="10"/>
    <rect x="0" y="0" width="6" height="140" fill="#FF6B2C"/>
    <text x="40" y="38" fill="#FF6B2C" font-size="14" letter-spacing="2">RUNG 3 — NEW MAY 11, 2026</text>
    <text x="40" y="84" fill="#FAFAF7" font-size="36" font-weight="600" font-family="Source Serif 4, Georgia, serif">/goal &lt;condition&gt;</text>
    <text x="40" y="118" fill="#AAA79A" font-size="18">Operator approves: the finish line, once</text>
    <text x="780" y="58" fill="#AAA79A" font-size="18">Haiku 4.5 evaluator checks each turn</text>
    <text x="780" y="86" fill="#AAA79A" font-size="18">condition met → goal clears</text>
    <text x="780" y="114" fill="#71717A" font-size="14" font-style="italic">run until done, no per-turn ask</text>
  </g>

  <!-- Footer / wedge -->
  <text x="80" y="800" fill="#22D3A0" font-size="16" font-weight="500">
    The wedge: each rung removes the kind of question the previous rung asked.
  </text>
  <text x="80" y="830" fill="#71717A" font-size="14">
    Plan mode → "should I do this?"   Auto mode → "should I call this tool?"   /goal → "are we there yet?"
  </text>

  <!-- Site footer mark -->
  <text x="1520" y="850" fill="#3F3F46" font-size="12" text-anchor="end" font-family="JetBrains Mono, monospace">dive.vladyslavpodoliako.com · Ch 38</text>
</svg>
