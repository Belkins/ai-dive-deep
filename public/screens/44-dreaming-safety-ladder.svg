<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>

  <!-- Title -->
  <text x="80" y="96" fill="#71717A" font-size="13" letter-spacing="3" font-family="JetBrains Mono, monospace">DREAMING · THE PROPOSE-ONLY LADDER</text>
  <text x="80" y="146" fill="#FAFAF7" font-size="38" font-weight="500" font-family="Source Serif 4, Georgia, serif">Propose-only isn&#39;t the default. It&#39;s the ceiling.</text>
  <text x="80" y="186" fill="#AAA79A" font-size="16">The most destructive thing the whole pipeline can do is write one markdown file. That&#39;s not a limitation — that&#39;s the design.</text>

  <!-- TOP rung — forbidden -->
  <g transform="translate(80, 250)">
    <rect x="0" y="0" width="1440" height="120" rx="12" fill="#1A1410" stroke="#5C2108" stroke-width="1.5" stroke-dasharray="2 6"/>
    <text x="32" y="44" fill="#85300C" font-size="13" letter-spacing="2" font-family="JetBrains Mono, monospace">LEVEL 3 · DESTRUCTIVE</text>
    <text x="32" y="82" fill="#8C897C" font-size="24" font-weight="600" font-family="Source Serif 4, Georgia, serif" text-decoration="line-through">Auto-delete / overwrite / consolidate a memory</text>
    <text x="1408" y="62" fill="#B33E10" font-size="15" text-anchor="end" font-family="JetBrains Mono, monospace">NO CODE PATH EXISTS</text>
    <line x1="32" y1="74" x2="640" y2="74" stroke="#85300C" stroke-width="2"/>
  </g>

  <!-- MIDDLE rung — earned, greyed -->
  <g transform="translate(80, 410)">
    <rect x="0" y="0" width="1440" height="120" rx="12" fill="#141518" stroke="#26251F" stroke-width="1.5"/>
    <text x="32" y="44" fill="#56544B" font-size="13" letter-spacing="2" font-family="JetBrains Mono, monospace">LEVEL 2 · AUTO-WRITE (apply-new)</text>
    <text x="32" y="82" fill="#8C897C" font-size="24" font-weight="600" font-family="Source Serif 4, Georgia, serif">Write NEW memories without a human</text>
    <text x="1408" y="56" fill="#71717A" font-size="14" text-anchor="end" font-family="JetBrains Mono, monospace">EARNED, not assumed:</text>
    <text x="1408" y="78" fill="#71717A" font-size="14" text-anchor="end" font-family="JetBrains Mono, monospace">schema + ledger + 30d, precision &#8805; 80%</text>
  </g>

  <!-- CEILING line, just above the floor -->
  <g transform="translate(80, 560)">
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#FF6B2C" stroke-width="3"/>
    <rect x="600" y="-17" width="240" height="34" rx="17" fill="#0E0F11" stroke="#FF6B2C" stroke-width="2"/>
    <text x="720" y="6" fill="#FF6B2C" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2" font-family="JetBrains Mono, monospace">THE CEILING</text>
  </g>

  <!-- FLOOR rung — where it lives, solid -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="1440" height="140" rx="12" fill="#161B1F" stroke="#FF6B2C" stroke-width="2.5"/>
    <text x="32" y="44" fill="#22D3A0" font-size="13" letter-spacing="2" font-family="JetBrains Mono, monospace">LEVEL 1 · SURFACE  ·  WHERE DREAM LIVES — AND ITS MAX</text>
    <text x="32" y="86" fill="#FAFAF7" font-size="26" font-weight="700" font-family="Source Serif 4, Georgia, serif">Write a dated review file. A human runs /learn.</text>
    <text x="32" y="118" fill="#AAA79A" font-size="15">The floor and the ceiling are the same rung. The human + the existing /learn skill stay the writer.</text>
  </g>

  <text x="1520" y="864" fill="#3F3F46" font-size="11" text-anchor="end" font-family="JetBrains Mono, monospace">dive.vladyslavpodoliako.com · Ch 44 · the propose-only safety ladder</text>
</svg>
