<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>

  <text x="80" y="84" fill="#FF6B2C" font-size="13" letter-spacing="3" font-family="JetBrains Mono, monospace">CHAPTER 46 · THE CONTRAST GATE</text>
  <text x="80" y="134" fill="#FAFAF7" font-size="40" font-weight="500" font-family="Source Serif 4, Georgia, serif">The model shipped plausible. The arithmetic shipped correct.</text>
  <text x="80" y="172" fill="#AAA79A" font-size="16">The light theme&#39;s accents were never re-tinted — they did text duty below the AA floor for weeks, and no eye caught it.</text>

  <!-- BEFORE panel -->
  <text x="80" y="250" fill="#EF4444" font-size="14" font-weight="700" letter-spacing="1" font-family="JetBrains Mono, monospace">BEFORE · WHAT SHIPPED</text>
  <rect x="80" y="268" width="680" height="430" rx="12" fill="#FAFAF7" stroke="#262521" stroke-width="1"/>
  <text x="116" y="332" fill="#0E0F11" font-size="22" font-family="Source Serif 4, Georgia, serif">A light page with two accent words:</text>
  <text x="116" y="392" fill="#FF6B2C" font-size="34" font-weight="600">Verified</text>
  <text x="116" y="442" fill="#22D3A0" font-size="34" font-weight="600">system state</text>
  <text x="116" y="480" fill="#56544B" font-size="15">dark-theme flame and terminal, reused as text on light</text>

  <g font-family="JetBrains Mono, monospace">
    <rect x="116" y="512" width="240" height="40" rx="8" fill="#FBE3E0" stroke="#EF4444" stroke-width="1.5"/>
    <text x="136" y="538" fill="#B33E10" font-size="15">flame &#160; 2.7 : 1 &#160; ✕</text>
    <rect x="372" y="512" width="260" height="40" rx="8" fill="#FBE3E0" stroke="#EF4444" stroke-width="1.5"/>
    <text x="392" y="538" fill="#B33E10" font-size="15">terminal &#160; 1.7 : 1 &#160; ✕</text>
  </g>
  <text x="116" y="618" fill="#EF4444" font-size="20" font-weight="700">✕ FAILS WCAG AA — the floor is 4.5 : 1</text>
  <text x="116" y="656" fill="#56544B" font-size="15">Looked finished. Was objectively wrong.</text>

  <!-- arrow -->
  <g transform="translate(800, 483)">
    <line x1="-12" y1="0" x2="40" y2="0" stroke="#FF6B2C" stroke-width="3"/>
    <path d="M40 -8 L56 0 L40 8 Z" fill="#FF6B2C"/>
    <text x="22" y="-18" fill="#AAA79A" font-size="12" text-anchor="middle" font-family="JetBrains Mono, monospace">re-tint</text>
  </g>

  <!-- AFTER panel -->
  <text x="840" y="250" fill="#22D3A0" font-size="14" font-weight="700" letter-spacing="1" font-family="JetBrains Mono, monospace">AFTER · WHAT THE CHECK FORCED</text>
  <rect x="840" y="268" width="680" height="430" rx="12" fill="#FAFAF7" stroke="#262521" stroke-width="1"/>
  <text x="876" y="332" fill="#0E0F11" font-size="22" font-family="Source Serif 4, Georgia, serif">Same two words, same light page:</text>
  <text x="876" y="392" fill="#C2410C" font-size="34" font-weight="600">Verified</text>
  <text x="876" y="442" fill="#047857" font-size="34" font-weight="600">system state</text>
  <text x="876" y="480" fill="#56544B" font-size="15">same hues, darkened until they clear the floor</text>

  <g font-family="JetBrains Mono, monospace">
    <rect x="876" y="512" width="240" height="40" rx="8" fill="#E2F6EF" stroke="#22D3A0" stroke-width="1.5"/>
    <text x="896" y="538" fill="#0E8E6A" font-size="15">flame &#160; ≥ 4.5 : 1 &#160; ✓</text>
    <rect x="1132" y="512" width="260" height="40" rx="8" fill="#E2F6EF" stroke="#22D3A0" stroke-width="1.5"/>
    <text x="1152" y="538" fill="#0E8E6A" font-size="15">terminal &#160; ≥ 4.5 : 1 &#160; ✓</text>
  </g>
  <text x="876" y="618" fill="#0E8E6A" font-size="20" font-weight="700">✓ PASSES WCAG AA</text>
  <text x="876" y="656" fill="#56544B" font-size="15">A three-line fix, once a number named it.</text>

  <text x="80" y="788" fill="#FAFAF7" font-size="20" font-family="Source Serif 4, Georgia, serif">The eye approved both. Only the measurement could tell them <tspan fill="#FF6B2C" font-style="italic">apart</tspan>.</text>
  <text x="80" y="822" fill="#AAA79A" font-size="15">AI generates plausible, not correct. A measurable check is the one thing in the room with no taste to fool.</text>
  <text x="1520" y="852" fill="#3F3F46" font-size="11" text-anchor="end" font-family="JetBrains Mono, monospace">dive.vladyslavpodoliako.com · Ch 46 · the contrast gate</text>
</svg>
