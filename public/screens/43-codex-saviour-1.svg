<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD24A"/><stop offset="0.5" stop-color="#FF8E54"/><stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#0E0F11"/>

  <!-- header -->
  <text x="80" y="62" fill="#FF6B2C" font-size="15" letter-spacing="6" font-weight="500">CHAPTER 43 · CODEX AS SAVIOUR</text>
  <text x="80" y="120" fill="#FAFAF7" font-size="50" font-weight="500" font-family="Source Serif 4, Georgia, serif" letter-spacing="-1">The bench — fourteen explorers, one repo</text>
  <text x="80" y="156" fill="#AAA79A" font-size="18">Not one agent writing everything. A swarm fanned across the surface, each reading a slice — and each lens with veto power before code lands.</text>
  <text x="1520" y="62" fill="#71717A" font-size="11" letter-spacing="3" text-anchor="end">job · plan folderly simplification</text>

  <!-- LEFT: the roster -->
  <g transform="translate(70, 220)">
    <rect x="0" y="0" width="760" height="690" fill="#14181C" stroke="#2A3138" stroke-width="1" rx="14"/>
    <text x="32" y="48" fill="#FF6B2C" font-size="12" letter-spacing="3" font-weight="600">SPAWNED · ALL READING, NONE WRITING YET</text>

    <!-- column 1 -->
    <g transform="translate(32, 78)">
      <g><circle cx="14" cy="20" r="7" fill="#FF8E54"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Pauli</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
      <g transform="translate(0,58)"><circle cx="14" cy="20" r="7" fill="#FF6B6B"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Planck</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
      <g transform="translate(0,116)"><circle cx="14" cy="20" r="7" fill="#6EE7B7"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Hume</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
      <g transform="translate(0,174)"><circle cx="14" cy="20" r="7" fill="#A78BFA"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Ramanujan</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
      <g transform="translate(0,232)"><circle cx="14" cy="20" r="7" fill="#FF6B6B"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Averroes</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
      <g transform="translate(0,290)"><circle cx="14" cy="20" r="7" fill="#A78BFA"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Gibbs</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
      <g transform="translate(0,348)"><circle cx="14" cy="20" r="7" fill="#FF8E54"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Fermat</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
    </g>
    <!-- column 2 -->
    <g transform="translate(400, 78)">
      <g><circle cx="14" cy="20" r="7" fill="#2B6FEE"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Sagan</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
      <g transform="translate(0,58)"><circle cx="14" cy="20" r="7" fill="#FF8E54"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Hooke</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
      <g transform="translate(0,116)"><circle cx="14" cy="20" r="7" fill="#6EE7B7"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Socrates</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
      <g transform="translate(0,174)"><circle cx="14" cy="20" r="7" fill="#A78BFA"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Feynman</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
      <g transform="translate(0,232)"><circle cx="14" cy="20" r="7" fill="#FF6B6B"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Beauvoir</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
      <g transform="translate(0,290)"><circle cx="14" cy="20" r="7" fill="#2B6FEE"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Franklin</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
      <g transform="translate(0,348)"><circle cx="14" cy="20" r="7" fill="#FF8E54"/><text x="36" y="26" fill="#FAFAF7" font-size="20" font-weight="500">Mill</text><text x="200" y="26" fill="#71717A" font-size="14">explorer</text></g>
    </g>
    <text x="32" y="540" fill="#71717A" font-size="14" font-family="JetBrains Mono, monospace">e.g. Fermat → HubSpot integration routes · Harvey → API-key entitlement</text>
    <text x="32" y="566" fill="#71717A" font-size="14" font-family="JetBrains Mono, monospace">"I've split the next work: one reads route/auth boundaries, another owns the key."</text>
  </g>

  <!-- RIGHT: each lens has veto -->
  <g transform="translate(880, 220)">
    <rect x="0" y="0" width="650" height="540" fill="#14181C" stroke="#2A3138" stroke-width="1" rx="14"/>
    <text x="32" y="48" fill="#195EE6" font-size="12" letter-spacing="3" font-weight="600">EACH LENS HAS VETO — THEY DISAGREE PRODUCTIVELY</text>
    <g font-size="17" fill="#E5E5E5">
      <text x="32" y="104">A delete that helps <tspan fill="#6EE7B7">UX</tspan> can hurt <tspan fill="#FF8E54">SEO</tspan>.</text>
      <text x="32" y="156">A <tspan fill="#FF6B6B">security</tspan> fix can break an <tspan fill="#2B6FEE">integration</tspan>.</text>
      <text x="32" y="208">A brand simplification can remove useful proof.</text>
    </g>
    <line x1="32" y1="248" x2="618" y2="248" stroke="#2A3138" stroke-width="1"/>
    <text x="32" y="292" fill="#AAA79A" font-size="15">The swarm forces every tradeoff explicit</text>
    <text x="32" y="318" fill="#AAA79A" font-size="15">BEFORE the code changes land — not after.</text>
    <g transform="translate(32, 360)" font-size="14.5" fill="#FAFAF7" font-family="JetBrains Mono, monospace">
      <text y="0">brand · ux · seo · api-compat · security</text>
      <text y="30">account-ia · dead-code · qa · release · docs</text>
    </g>
    <text x="32" y="470" fill="#195EE6" font-size="15" font-weight="600">ten lenses · one north star · one repo</text>
  </g>

  <!-- toast + emberling -->
  <g transform="translate(880, 790)">
    <rect x="0" y="0" width="650" height="120" fill="#0F1A14" stroke="#6EE7B7" stroke-width="1.5" rx="12"/>
    <path d="M28 30 l14 14 l24 -30" stroke="#6EE7B7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="40" fill="#FAFAF7" font-size="18" font-weight="600">Plan Folderly simplification</text>
    <text x="84" y="70" fill="#AAA79A" font-size="15">Pushed and verified on production.</text>
    <text x="84" y="96" fill="#AAA79A" font-size="15">What I fixed: guest analytics no longer 401s.</text>
  </g>
  <!-- emberling glyph -->
  <g transform="translate(150, 935)">
    <path d="M0,0 C-22,-26 -10,-54 4,-78 C8,-58 22,-58 18,-36 C30,-46 30,-30 26,-18 C40,-26 36,-2 22,8 C10,16 -10,16 -20,6 C-26,0 -24,-2 0,0 Z" fill="url(#ember)" transform="translate(0,8)"/>
    <rect x="-12" y="-30" width="9" height="6" rx="2" fill="#1BE3D8"/><rect x="3" y="-30" width="9" height="6" rx="2" fill="#1BE3D8"/>
    <text x="56" y="-22" fill="#71717A" font-size="14" font-style="italic">Emberling — idling on the desktop,</text>
    <text x="56" y="0" fill="#71717A" font-size="14" font-style="italic">finally getting its Folderly simplification.</text>
  </g>
</svg>
