<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>

  <text x="80" y="90" fill="#FF6B2C" font-size="18" letter-spacing="6" font-weight="500">THE SWARM</text>
  <text x="80" y="160" fill="#FAFAF7" font-size="56" font-weight="500" font-family="Source Serif 4, Georgia, serif" letter-spacing="-1">3-4 parallel + 1 synthesis</text>
  <text x="80" y="200" fill="#AAA79A" font-size="20">the empirical sweet spot · 5+ invites filesystem contention</text>

  <!-- Parent agent -->
  <g transform="translate(700, 280)">
    <rect x="0" y="0" width="200" height="80" fill="#1A1B1F" stroke="#FF6B2C" stroke-width="2" rx="8"/>
    <text x="100" y="35" fill="#FF6B2C" font-size="12" letter-spacing="2" text-anchor="middle">PARENT</text>
    <text x="100" y="62" fill="#FAFAF7" font-size="18" font-weight="500" text-anchor="middle">orchestrator</text>
  </g>

  <!-- 4 connecting lines -->
  <line x1="800" y1="360" x2="280" y2="480" stroke="#56544B" stroke-width="1.5"/>
  <line x1="800" y1="360" x2="600" y2="480" stroke="#56544B" stroke-width="1.5"/>
  <line x1="800" y1="360" x2="1000" y2="480" stroke="#56544B" stroke-width="1.5"/>
  <line x1="800" y1="360" x2="1320" y2="480" stroke="#56544B" stroke-width="1.5"/>

  <!-- Wave 1 agents (parallel) -->
  <g transform="translate(180, 480)">
    <rect x="0" y="0" width="200" height="120" fill="#161B1F" stroke="#26251F" stroke-width="1" rx="8"/>
    <text x="100" y="30" fill="#AAA79A" font-size="11" letter-spacing="2" text-anchor="middle">WAVE 1 · AGENT A</text>
    <text x="100" y="60" fill="#FAFAF7" font-size="16" font-weight="500" text-anchor="middle">Distribution</text>
    <text x="100" y="84" fill="#71717A" font-size="12" text-anchor="middle">channels · timing</text>
    <text x="100" y="104" fill="#71717A" font-size="12" text-anchor="middle">~8 min · WebSearch</text>
  </g>

  <g transform="translate(500, 480)">
    <rect x="0" y="0" width="200" height="120" fill="#161B1F" stroke="#26251F" stroke-width="1" rx="8"/>
    <text x="100" y="30" fill="#AAA79A" font-size="11" letter-spacing="2" text-anchor="middle">WAVE 1 · AGENT B</text>
    <text x="100" y="60" fill="#FAFAF7" font-size="16" font-weight="500" text-anchor="middle">Viral mechanics</text>
    <text x="100" y="84" fill="#71717A" font-size="12" text-anchor="middle">loops · OG cards</text>
    <text x="100" y="104" fill="#71717A" font-size="12" text-anchor="middle">~8 min · repo read</text>
  </g>

  <g transform="translate(900, 480)">
    <rect x="0" y="0" width="200" height="120" fill="#161B1F" stroke="#26251F" stroke-width="1" rx="8"/>
    <text x="100" y="30" fill="#AAA79A" font-size="11" letter-spacing="2" text-anchor="middle">WAVE 1 · AGENT C</text>
    <text x="100" y="60" fill="#FAFAF7" font-size="16" font-weight="500" text-anchor="middle">Hook audit</text>
    <text x="100" y="84" fill="#71717A" font-size="12" text-anchor="middle">pull-quotes · titles</text>
    <text x="100" y="104" fill="#71717A" font-size="12" text-anchor="middle">~8 min · chapter read</text>
  </g>

  <g transform="translate(1220, 480)">
    <rect x="0" y="0" width="200" height="120" fill="#161B1F" stroke="#26251F" stroke-width="1" rx="8"/>
    <text x="100" y="30" fill="#AAA79A" font-size="11" letter-spacing="2" text-anchor="middle">WAVE 1 · AGENT D</text>
    <text x="100" y="60" fill="#FAFAF7" font-size="16" font-weight="500" text-anchor="middle">Pre-flight deps</text>
    <text x="100" y="84" fill="#71717A" font-size="12" text-anchor="middle">2026 viability</text>
    <text x="100" y="104" fill="#71717A" font-size="12" text-anchor="middle">~8 min · WebFetch</text>
  </g>

  <!-- arrows to synthesis -->
  <line x1="280" y1="600" x2="800" y2="700" stroke="#22D3A0" stroke-width="1.5"/>
  <line x1="600" y1="600" x2="800" y2="700" stroke="#22D3A0" stroke-width="1.5"/>
  <line x1="1000" y1="600" x2="800" y2="700" stroke="#22D3A0" stroke-width="1.5"/>
  <line x1="1320" y1="600" x2="800" y2="700" stroke="#22D3A0" stroke-width="1.5"/>

  <!-- Wave 2: synthesis -->
  <g transform="translate(700, 700)">
    <rect x="0" y="0" width="200" height="80" fill="#1A1B1F" stroke="#22D3A0" stroke-width="2" rx="8"/>
    <text x="100" y="32" fill="#22D3A0" font-size="11" letter-spacing="2" text-anchor="middle">WAVE 2 · SYNTHESIS</text>
    <text x="100" y="60" fill="#FAFAF7" font-size="18" font-weight="500" text-anchor="middle">decision surface</text>
  </g>

  <!-- Side notes -->
  <text x="80" y="850" fill="#FF8E54" font-size="14" letter-spacing="1">
    Why 3-4: filesystem contention starts at 5+ · subagent watchdog stalls at 600s · synthesis owns the cross-agent dedup
  </text>

  <text x="1520" y="870" fill="#3F3F46" font-size="12" text-anchor="end" font-family="JetBrains Mono, monospace">dive.vladyslavpodoliako.com · Ch 6</text>
</svg>
