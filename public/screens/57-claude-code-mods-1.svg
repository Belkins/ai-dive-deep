<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>
  <text x="80" y="84" fill="#F4F1EA" font-size="50" font-weight="700" text-anchor="start">What the screen already showed, and what each mod adds</text>
  <text x="80" y="134" fill="#9A9789" font-size="26" font-weight="400" text-anchor="start">Left: in place before 3 October 2026. Right: the mod built for the gap, and where it draws.</text>
  <text x="80" y="236" fill="#9A9789" font-size="20" font-weight="600" text-anchor="start">ALREADY THERE</text>
  <text x="820" y="236" fill="#9A9789" font-size="20" font-weight="600" text-anchor="start">THE MOD, AND WHAT IT ADDS</text>
  <rect x="80" y="262" width="620" height="72" rx="10" fill="#17191C" stroke="#2A2D31" stroke-width="2"/>
  <text x="104" y="307" fill="#C9C3B3" font-size="23" font-weight="400" text-anchor="start">Status line: context used, as a %</text>
  <line x1="712" y1="298" x2="796" y2="298" stroke="#FF6B2C" stroke-width="3"/>
  <polygon points="808,298 796,291 796,305" fill="#FF6B2C"/>
  <rect x="820" y="262" width="700" height="72" rx="10" fill="#1C1A17" stroke="#FF6B2C" stroke-width="2"/>
  <text x="844" y="293" fill="#F4F1EA" font-size="25" font-weight="700" text-anchor="start">Token Weather</text>
  <text x="844" y="321" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">band above the prompt: trend and turns to compaction</text>
  <rect x="80" y="358" width="620" height="72" rx="10" fill="#17191C" stroke="#2A2D31" stroke-width="2"/>
  <text x="104" y="403" fill="#C9C3B3" font-size="23" font-weight="400" text-anchor="start">Status line: 5-hour and 7-day bars</text>
  <line x1="712" y1="394" x2="796" y2="394" stroke="#FF6B2C" stroke-width="3"/>
  <polygon points="808,394 796,387 796,401" fill="#FF6B2C"/>
  <rect x="820" y="358" width="700" height="72" rx="10" fill="#1C1A17" stroke="#FF6B2C" stroke-width="2"/>
  <text x="844" y="389" fill="#F4F1EA" font-size="25" font-weight="700" text-anchor="start">5h Pacer</text>
  <text x="844" y="417" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">status line: burn rate and when the wall comes</text>
  <rect x="80" y="454" width="620" height="72" rx="10" fill="#17191C" stroke="#2A2D31" stroke-width="2"/>
  <text x="104" y="499" fill="#C9C3B3" font-size="23" font-weight="400" text-anchor="start">Careful hook: asks before rm -r, reset --hard</text>
  <line x1="712" y1="490" x2="796" y2="490" stroke="#FF6B2C" stroke-width="3"/>
  <polygon points="808,490 796,483 796,497" fill="#FF6B2C"/>
  <rect x="820" y="454" width="700" height="72" rx="10" fill="#1C1A17" stroke="#FF6B2C" stroke-width="2"/>
  <text x="844" y="485" fill="#F4F1EA" font-size="25" font-weight="700" text-anchor="start">Blast Radius</text>
  <text x="844" y="513" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">inside that same prompt: what would be lost</text>
  <rect x="80" y="550" width="620" height="72" rx="10" fill="#17191C" stroke="#2A2D31" stroke-width="2"/>
  <text x="104" y="595" fill="#C9C3B3" font-size="23" font-weight="400" text-anchor="start">Session start: a count of other sessions</text>
  <line x1="712" y1="586" x2="796" y2="586" stroke="#FF6B2C" stroke-width="3"/>
  <polygon points="808,586 796,579 796,593" fill="#FF6B2C"/>
  <rect x="820" y="550" width="700" height="72" rx="10" fill="#1C1A17" stroke="#FF6B2C" stroke-width="2"/>
  <text x="844" y="581" fill="#F4F1EA" font-size="25" font-weight="700" text-anchor="start">Peers</text>
  <text x="844" y="609" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">status line: who works here, shared-file warning</text>
  <rect x="80" y="646" width="620" height="72" rx="10" fill="#17191C" stroke="#2A2D31" stroke-width="2"/>
  <text x="104" y="691" fill="#C9C3B3" font-size="23" font-weight="400" text-anchor="start">A rules file of shell traps, read by the model</text>
  <line x1="712" y1="682" x2="796" y2="682" stroke="#FF6B2C" stroke-width="3"/>
  <polygon points="808,682 796,675 796,689" fill="#FF6B2C"/>
  <rect x="820" y="646" width="700" height="72" rx="10" fill="#1C1A17" stroke="#FF6B2C" stroke-width="2"/>
  <text x="844" y="677" fill="#F4F1EA" font-size="25" font-weight="700" text-anchor="start">Gotcha Guard</text>
  <text x="844" y="705" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">refuses ten traps and sends Claude the fix</text>
  <rect x="80" y="742" width="620" height="72" rx="10" fill="#17191C" stroke="#2A2D31" stroke-width="2"/>
  <text x="104" y="787" fill="#C9C3B3" font-size="23" font-weight="400" text-anchor="start">Diffs scrolling past in the transcript</text>
  <line x1="712" y1="778" x2="796" y2="778" stroke="#FF6B2C" stroke-width="3"/>
  <polygon points="808,778 796,771 796,785" fill="#FF6B2C"/>
  <rect x="820" y="742" width="700" height="72" rx="10" fill="#1C1A17" stroke="#FF6B2C" stroke-width="2"/>
  <text x="844" y="773" fill="#F4F1EA" font-size="25" font-weight="700" text-anchor="start">Replay Theater</text>
  <text x="844" y="801" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">a pane on /replay: every edit, by turn</text>
</svg>
