<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>

  <text x="80" y="84" fill="#FF6B2C" font-size="13" letter-spacing="3" font-family="JetBrains Mono, monospace">CHAPTER 46 · INTENT IS THE INPUT</text>
  <text x="80" y="134" fill="#FAFAF7" font-size="40" font-weight="500" font-family="Source Serif 4, Georgia, serif">One product, three intents — three typefaces.</text>
  <text x="80" y="172" fill="#AAA79A" font-size="16">flicked.email, captured 2026-06-16. The mood and the type change across the three pages; the brand mint never does.</text>

  <!-- CHAOS -->
  <rect x="80" y="226" width="460" height="384" rx="12" fill="#FAFAF7" stroke="#262521" stroke-width="1"/>
  <rect x="104" y="252" width="300" height="30" rx="6" fill="#0E0F11"/>
  <text x="119" y="273" fill="#FAFAF7" font-size="13" font-family="JetBrains Mono, monospace">BRICOLAGE GROTESQUE · DISPLAY</text>
  <text x="104" y="350" fill="#0E0F11" font-size="34" font-weight="800">your inbox is in</text>
  <text x="104" y="392" fill="#0E0F11" font-size="34" font-weight="800">its villain era.</text>
  <text x="104" y="448" fill="#56544B" font-size="16">fix it. calmly.</text>
  <circle cx="120" cy="520" r="16" fill="#FF5FB4"/>
  <circle cx="160" cy="520" r="16" fill="#D6FF2E"/>
  <circle cx="200" cy="520" r="16" fill="#9B6BFF"/>
  <circle cx="240" cy="520" r="16" fill="#35E8B8"/>
  <text x="104" y="576" fill="#56544B" font-size="15" font-family="JetBrains Mono, monospace">light · maximalist · 4 accents</text>

  <!-- HYPE -->
  <rect x="570" y="226" width="460" height="384" rx="12" fill="#111313" stroke="#262521" stroke-width="1"/>
  <rect x="594" y="252" width="170" height="30" rx="6" fill="#F7F7F2"/>
  <text x="609" y="273" fill="#111313" font-size="13" font-family="JetBrains Mono, monospace">INTER · SANS</text>
  <text x="594" y="350" fill="#F7F7F2" font-size="32" font-weight="600">decide your inbox.</text>
  <text x="594" y="392" fill="#F7F7F2" font-size="32" font-weight="600">one swipe.</text>
  <text x="594" y="448" fill="#9AA0A6" font-size="16">reach zero in 90 seconds.</text>
  <circle cx="610" cy="520" r="16" fill="#FF5D6C"/>
  <circle cx="650" cy="520" r="16" fill="#35E8B8"/>
  <text x="594" y="576" fill="#9AA0A6" font-size="15" font-family="JetBrains Mono, monospace">dark · momentum · 1 accent</text>

  <!-- CALM -->
  <rect x="1060" y="226" width="460" height="384" rx="12" fill="#F7F7F2" stroke="#262521" stroke-width="1"/>
  <rect x="1084" y="252" width="190" height="30" rx="6" fill="#0E0F11"/>
  <text x="1099" y="273" fill="#FAFAF7" font-size="13" font-family="JetBrains Mono, monospace">FRAUNCES · SERIF</text>
  <text x="1084" y="352" fill="#111313" font-size="31" font-family="Source Serif 4, Georgia, serif">Delete the dread,</text>
  <text x="1084" y="394" fill="#111313" font-size="31" font-family="Source Serif 4, Georgia, serif">not the emails.</text>
  <text x="1084" y="450" fill="#6C736E" font-size="16" font-family="Source Serif 4, Georgia, serif">we make money when you stop.</text>
  <circle cx="1100" cy="520" r="16" fill="#35E8B8"/>
  <circle cx="1140" cy="520" r="16" fill="#C7CDC9"/>
  <text x="1084" y="576" fill="#6C736E" font-size="15" font-family="JetBrains Mono, monospace">light · restraint · 1 accent</text>

  <!-- mint invariant rail -->
  <line x1="80" y1="676" x2="1520" y2="676" stroke="#35E8B8" stroke-width="3"/>
  <circle cx="120" cy="676" r="9" fill="#35E8B8"/>
  <circle cx="650" cy="676" r="9" fill="#35E8B8"/>
  <circle cx="1100" cy="676" r="9" fill="#35E8B8"/>
  <text x="80" y="716" fill="#35E8B8" font-size="15" font-weight="600" font-family="JetBrains Mono, monospace">the brand mint #35E8B8 — the one thing all three share</text>

  <text x="80" y="800" fill="#FAFAF7" font-size="20" font-family="Source Serif 4, Georgia, serif">The variable layer carries the <tspan fill="#FF6B2C" font-style="italic">intent</tspan>. The invariant carries the <tspan fill="#35E8B8">brand</tspan>.</text>
  <text x="80" y="834" fill="#AAA79A" font-size="15">The model built all three equally well. It could not tell you which intent was true.</text>
  <text x="1520" y="852" fill="#3F3F46" font-size="11" text-anchor="end" font-family="JetBrains Mono, monospace">dive.vladyslavpodoliako.com · Ch 46 · three designs, one product</text>
</svg>
