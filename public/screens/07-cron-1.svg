<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>

  <rect x="60" y="40" width="1480" height="820" fill="#161B1F" stroke="#26251F" stroke-width="1" rx="10"/>
  <rect x="60" y="40" width="1480" height="44" fill="#1A1B1F" rx="10"/>
  <rect x="60" y="70" width="1480" height="14" fill="#1A1B1F"/>
  <circle cx="84" cy="62" r="6" fill="#FF5F57"/>
  <circle cx="104" cy="62" r="6" fill="#FEBC2E"/>
  <circle cx="124" cy="62" r="6" fill="#28C840"/>
  <text x="760" y="66" fill="#71717A" font-size="13" text-anchor="middle" font-family="JetBrains Mono, monospace">Cowork · Scheduled task detail</text>

  <!-- Breadcrumb + title -->
  <text x="100" y="120" fill="#71717A" font-size="12" font-family="JetBrains Mono, monospace">Scheduled tasks › Belkins pipeline heartbeat</text>
  <text x="100" y="160" fill="#FAFAF7" font-size="28" font-weight="500" font-family="Source Serif 4, Georgia, serif">Belkins pipeline heartbeat</text>
  <text x="100" y="190" fill="#AAA79A" font-size="14">Daily pipeline pulse — flags deals quiet &gt;4 days at stage 3+, SDR ramp progress vs week-2 cohort.</text>

  <!-- Schedule + status row -->
  <g transform="translate(100, 220)">
    <!-- Cron expression card -->
    <rect x="0" y="0" width="320" height="90" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
    <text x="20" y="26" fill="#AAA79A" font-size="11" letter-spacing="2" font-family="JetBrains Mono, monospace">SCHEDULE</text>
    <text x="20" y="56" fill="#FAFAF7" font-size="22" font-weight="600" font-family="JetBrains Mono, monospace">30 7 * * 1-5</text>
    <text x="20" y="78" fill="#71717A" font-size="12">Weekdays · 7:30 AM ET</text>

    <!-- Last run -->
    <rect x="340" y="0" width="320" height="90" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
    <text x="360" y="26" fill="#AAA79A" font-size="11" letter-spacing="2" font-family="JetBrains Mono, monospace">LAST RUN</text>
    <text x="360" y="56" fill="#22D3A0" font-size="22" font-weight="600" font-family="JetBrains Mono, monospace">✓ 12s</text>
    <text x="360" y="78" fill="#71717A" font-size="12">Today · 7:30:04 AM ET</text>

    <!-- Output destination -->
    <rect x="680" y="0" width="320" height="90" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
    <text x="700" y="26" fill="#AAA79A" font-size="11" letter-spacing="2" font-family="JetBrains Mono, monospace">OUTPUT</text>
    <text x="700" y="56" fill="#FAFAF7" font-size="18" font-weight="600" font-family="JetBrains Mono, monospace">#vlad-ops</text>
    <text x="700" y="78" fill="#71717A" font-size="12">Slack channel · DM on failure</text>

    <!-- Cost -->
    <rect x="1020" y="0" width="320" height="90" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
    <text x="1040" y="26" fill="#AAA79A" font-size="11" letter-spacing="2" font-family="JetBrains Mono, monospace">AVG COST / RUN</text>
    <text x="1040" y="56" fill="#FAFAF7" font-size="22" font-weight="600" font-family="JetBrains Mono, monospace">$0.08</text>
    <text x="1040" y="78" fill="#71717A" font-size="12">≈ 38k tokens · Haiku-judged</text>
  </g>

  <!-- Connectors used -->
  <g transform="translate(100, 340)">
    <text x="0" y="0" fill="#AAA79A" font-size="11" letter-spacing="2" font-family="JetBrains Mono, monospace">CONNECTORS USED</text>
    <rect x="0" y="14" width="120" height="28" rx="14" fill="#161B1F" stroke="#FF6B2C" stroke-width="1"/>
    <text x="60" y="33" fill="#FF6B2C" font-size="12" text-anchor="middle" font-family="JetBrains Mono, monospace">HubSpot</text>
    <rect x="130" y="14" width="100" height="28" rx="14" fill="#161B1F" stroke="#FF8E54" stroke-width="1"/>
    <text x="180" y="33" fill="#FF8E54" font-size="12" text-anchor="middle" font-family="JetBrains Mono, monospace">Gong</text>
    <rect x="240" y="14" width="100" height="28" rx="14" fill="#161B1F" stroke="#22D3A0" stroke-width="1"/>
    <text x="290" y="33" fill="#22D3A0" font-size="12" text-anchor="middle" font-family="JetBrains Mono, monospace">Slack</text>
    <rect x="350" y="14" width="140" height="28" rx="14" fill="#161B1F" stroke="#56544B" stroke-width="1"/>
    <text x="420" y="33" fill="#AAA79A" font-size="12" text-anchor="middle" font-family="JetBrains Mono, monospace">vault (read-only)</text>
  </g>

  <!-- Run history -->
  <g transform="translate(100, 420)">
    <text x="0" y="0" fill="#AAA79A" font-size="11" letter-spacing="2" font-family="JetBrains Mono, monospace">LAST 14 RUNS</text>

    <!-- Run history blocks (14 squares: green = success, orange = warning, red = fail) -->
    <g transform="translate(0, 14)">
      <!-- 14 squares, 30×30 each, gap 6 -->
      <rect x="0" y="0" width="30" height="30" fill="#22D3A0" fill-opacity="0.6" rx="3"/>
      <rect x="36" y="0" width="30" height="30" fill="#22D3A0" fill-opacity="0.6" rx="3"/>
      <rect x="72" y="0" width="30" height="30" fill="#22D3A0" fill-opacity="0.6" rx="3"/>
      <rect x="108" y="0" width="30" height="30" fill="#22D3A0" fill-opacity="0.6" rx="3"/>
      <rect x="144" y="0" width="30" height="30" fill="#22D3A0" fill-opacity="0.6" rx="3"/>
      <rect x="180" y="0" width="30" height="30" fill="#FF8E54" fill-opacity="0.7" rx="3"/>
      <rect x="216" y="0" width="30" height="30" fill="#22D3A0" fill-opacity="0.6" rx="3"/>
      <rect x="252" y="0" width="30" height="30" fill="#22D3A0" fill-opacity="0.6" rx="3"/>
      <rect x="288" y="0" width="30" height="30" fill="#22D3A0" fill-opacity="0.6" rx="3"/>
      <rect x="324" y="0" width="30" height="30" fill="#FF5F57" fill-opacity="0.7" rx="3"/>
      <rect x="360" y="0" width="30" height="30" fill="#22D3A0" fill-opacity="0.6" rx="3"/>
      <rect x="396" y="0" width="30" height="30" fill="#22D3A0" fill-opacity="0.6" rx="3"/>
      <rect x="432" y="0" width="30" height="30" fill="#22D3A0" fill-opacity="0.6" rx="3"/>
      <rect x="468" y="0" width="30" height="30" fill="#22D3A0" fill-opacity="0.6" rx="3"/>

      <text x="0" y="50" fill="#71717A" font-size="11" font-family="JetBrains Mono, monospace">3 weeks ago</text>
      <text x="498" y="50" fill="#71717A" font-size="11" text-anchor="end" font-family="JetBrains Mono, monospace">today</text>
    </g>

    <text x="600" y="22" fill="#22D3A0" font-size="13" font-family="JetBrains Mono, monospace">● 12 succeeded</text>
    <text x="740" y="22" fill="#FF8E54" font-size="13" font-family="JetBrains Mono, monospace">● 1 slow (HubSpot 429)</text>
    <text x="930" y="22" fill="#FF5F57" font-size="13" font-family="JetBrains Mono, monospace">● 1 failed (Slack auth)</text>
    <text x="600" y="46" fill="#71717A" font-size="11" font-family="JetBrains Mono, monospace">success rate: 92.8% · within 60-sec SLA every successful run</text>
  </g>

  <!-- Latest output snippet -->
  <g transform="translate(100, 550)">
    <text x="0" y="0" fill="#AAA79A" font-size="11" letter-spacing="2" font-family="JetBrains Mono, monospace">TODAY'S OUTPUT · 7:30:04 AM ET</text>

    <rect x="0" y="14" width="1400" height="260" fill="#0E0F11" stroke="#3F3F46" stroke-width="1" rx="6"/>
    <text x="20" y="44" fill="#FAFAF7" font-size="14" font-weight="500" font-family="Source Serif 4, Georgia, serif">Belkins pipeline pulse · Tuesday Jan 21</text>

    <text x="20" y="74" fill="#FF6B2C" font-size="13" font-family="JetBrains Mono, monospace">3 deals went quiet ≥4 days at stage 3+</text>
    <text x="20" y="94" fill="#AAA79A" font-size="13" font-family="JetBrains Mono, monospace">  · TechCo Inc · last activity 5d ago · DM-engaged then dropped</text>
    <text x="20" y="112" fill="#AAA79A" font-size="13" font-family="JetBrains Mono, monospace">  · SaaSGroup AB · last activity 7d ago · waiting on procurement</text>
    <text x="20" y="130" fill="#AAA79A" font-size="13" font-family="JetBrains Mono, monospace">  · MidWest Logistics · last activity 4d ago · pricing pushback in Gong</text>

    <text x="20" y="162" fill="#FF8E54" font-size="13" font-family="JetBrains Mono, monospace">SDR ramp · week-2 cohort vs week-2 baseline</text>
    <text x="20" y="182" fill="#AAA79A" font-size="13" font-family="JetBrains Mono, monospace">  · Sam T. · 31 dials/day (target 28) · 4 meetings booked · +14% vs cohort</text>
    <text x="20" y="200" fill="#AAA79A" font-size="13" font-family="JetBrains Mono, monospace">  · Maria L. · 24 dials/day (target 28) · 2 meetings · -12% — coaching ping</text>

    <text x="20" y="232" fill="#22D3A0" font-size="13" font-family="JetBrains Mono, monospace">Pipeline value movement · +$87k this week (3 stage advances)</text>
  </g>

  <text x="1520" y="880" fill="#3F3F46" font-size="11" text-anchor="end" font-family="JetBrains Mono, monospace">dive.vladyslavpodoliako.com · Ch 7 · scheduled task detail · sanitized example</text>
</svg>
