<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>

  <text x="80" y="60" fill="#FF6B2C" font-size="15" letter-spacing="6" font-weight="500">CHAPTER 12 · CONFIG → LIVE STATE</text>
  <text x="80" y="118" fill="#FAFAF7" font-size="50" font-weight="500" font-family="Source Serif 4, Georgia, serif" letter-spacing="-1">On disk, then connected</text>
  <text x="80" y="154" fill="#AAA79A" font-size="18">The <tspan font-family="JetBrains Mono, monospace" fill="#E5E5E5">.mcp.json</tspan> you commit maps one-to-one to what <tspan font-family="JetBrains Mono, monospace" fill="#E5E5E5">/mcp</tspan> reports. Both sides match → you're wired.</text>
  <text x="1520" y="60" fill="#71717A" font-size="11" letter-spacing="3" text-anchor="end">EDITOR + /mcp SPLIT PANE</text>

  <!-- LEFT: .mcp.json editor -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="700" height="620" fill="#14181C" stroke="#2A3138" stroke-width="1" rx="10"/>
    <rect x="0" y="0" width="700" height="44" fill="#1A1F24" rx="10"/>
    <rect x="0" y="22" width="700" height="22" fill="#1A1F24"/>
    <circle cx="24" cy="22" r="6" fill="#FF6B5C"/><circle cx="46" cy="22" r="6" fill="#F5C24A"/><circle cx="68" cy="22" r="6" fill="#6EE7B7"/>
    <text x="350" y="27" fill="#AAA79A" font-size="14" text-anchor="middle" font-family="JetBrains Mono, monospace">.mcp.json</text>
    <g font-family="JetBrains Mono, monospace" font-size="16">
      <text x="30" y="84"  fill="#3F4651">1</text><text x="70" y="84"  fill="#E5E5E5">{</text>
      <text x="30" y="112" fill="#3F4651">2</text><text x="70" y="112" fill="#FF8E54">  "mcpServers"</text><text x="240" y="112" fill="#E5E5E5">: {</text>
      <text x="30" y="140" fill="#3F4651">3</text><text x="90" y="140" fill="#FF8E54">"filesystem"</text><text x="250" y="140" fill="#E5E5E5">: {</text>
      <text x="30" y="168" fill="#3F4651">4</text><text x="110" y="168" fill="#FF8E54">"command"</text><text x="240" y="168" fill="#E5E5E5">: </text><text x="265" y="168" fill="#6EE7B7">"npx"</text><text x="320" y="168" fill="#E5E5E5">,</text>
      <text x="30" y="196" fill="#3F4651">5</text><text x="110" y="196" fill="#FF8E54">"args"</text><text x="190" y="196" fill="#E5E5E5">: [</text><text x="230" y="196" fill="#6EE7B7">"-y"</text><text x="275" y="196" fill="#E5E5E5">, </text><text x="295" y="196" fill="#6EE7B7">"@mcp/filesystem"</text><text x="540" y="196" fill="#E5E5E5">]</text>
      <text x="30" y="224" fill="#3F4651">6</text><text x="90" y="224" fill="#E5E5E5">},</text>
      <text x="30" y="252" fill="#3F4651">7</text><text x="90" y="252" fill="#FF8E54">"github"</text><text x="200" y="252" fill="#E5E5E5">: {</text>
      <text x="30" y="280" fill="#3F4651">8</text><text x="110" y="280" fill="#FF8E54">"command"</text><text x="240" y="280" fill="#E5E5E5">: </text><text x="265" y="280" fill="#6EE7B7">"npx"</text><text x="320" y="280" fill="#E5E5E5">,</text>
      <text x="30" y="308" fill="#3F4651">9</text><text x="110" y="308" fill="#FF8E54">"args"</text><text x="190" y="308" fill="#E5E5E5">: [</text><text x="230" y="308" fill="#6EE7B7">"-y"</text><text x="275" y="308" fill="#E5E5E5">, </text><text x="295" y="308" fill="#6EE7B7">"@mcp/github"</text><text x="490" y="308" fill="#E5E5E5">]</text>
      <text x="24" y="336" fill="#3F4651">10</text><text x="90" y="336" fill="#E5E5E5">},</text>
      <text x="24" y="364" fill="#3F4651">11</text><text x="90" y="364" fill="#FF8E54">"postgres"</text><text x="230" y="364" fill="#E5E5E5">: {</text>
      <text x="24" y="392" fill="#3F4651">12</text><text x="110" y="392" fill="#FF8E54">"command"</text><text x="240" y="392" fill="#E5E5E5">: </text><text x="265" y="392" fill="#6EE7B7">"npx"</text><text x="320" y="392" fill="#E5E5E5">,</text>
      <text x="24" y="420" fill="#3F4651">13</text><text x="110" y="420" fill="#FF8E54">"args"</text><text x="190" y="420" fill="#E5E5E5">: [</text><text x="230" y="420" fill="#6EE7B7">"-y"</text><text x="275" y="420" fill="#E5E5E5">, </text><text x="295" y="420" fill="#6EE7B7">"@mcp/postgres"</text><text x="520" y="420" fill="#E5E5E5">],</text>
      <text x="24" y="448" fill="#3F4651">14</text><text x="110" y="448" fill="#FF8E54">"env"</text><text x="170" y="448" fill="#E5E5E5">: { </text><text x="205" y="448" fill="#FF8E54">"DB_URL"</text><text x="305" y="448" fill="#E5E5E5">: </text><text x="330" y="448" fill="#6EE7B7">"${DB_URL}"</text><text x="475" y="448" fill="#E5E5E5"> }</text>
      <text x="24" y="476" fill="#3F4651">15</text><text x="90" y="476" fill="#E5E5E5">}</text>
      <text x="24" y="504" fill="#3F4651">16</text><text x="70" y="504" fill="#E5E5E5">  }</text>
      <text x="24" y="532" fill="#3F4651">17</text><text x="70" y="532" fill="#E5E5E5">}</text>
    </g>
    <text x="30" y="588" fill="#71717A" font-size="13">Committed to the repo. Secrets via ${ } env, never inline.</text>
  </g>

  <!-- Arrow -->
  <text x="800" y="520" fill="#6EE7B7" font-size="30" text-anchor="middle">→</text>
  <text x="800" y="548" fill="#71717A" font-size="11" text-anchor="middle">restart</text>
  <text x="800" y="564" fill="#71717A" font-size="11" text-anchor="middle">/mcp</text>

  <!-- RIGHT: /mcp terminal output -->
  <g transform="translate(820, 200)">
    <rect x="0" y="0" width="700" height="620" fill="#0B0D0F" stroke="#2A3138" stroke-width="1" rx="10"/>
    <rect x="0" y="0" width="700" height="44" fill="#1A1F24" rx="10"/>
    <rect x="0" y="22" width="700" height="22" fill="#1A1F24"/>
    <text x="350" y="27" fill="#AAA79A" font-size="14" text-anchor="middle" font-family="JetBrains Mono, monospace">claude — /mcp</text>
    <g font-family="JetBrains Mono, monospace" font-size="16">
      <text x="30" y="86" fill="#6EE7B7">❯</text><text x="56" y="86" fill="#FAFAF7">/mcp</text>
      <text x="30" y="124" fill="#AAA79A">MCP servers · </text><text x="220" y="124" fill="#6EE7B7">3 connected</text>

      <text x="30" y="176" fill="#6EE7B7">●</text><text x="56" y="176" fill="#FAFAF7" font-size="17">filesystem</text>
      <text x="540" y="176" fill="#6EE7B7" font-size="14">connected</text>
      <text x="56" y="202" fill="#71717A" font-size="13">read_file · write_file · list_dir · 5 tools</text>

      <text x="30" y="254" fill="#6EE7B7">●</text><text x="56" y="254" fill="#FAFAF7" font-size="17">github</text>
      <text x="540" y="254" fill="#6EE7B7" font-size="14">connected</text>
      <text x="56" y="280" fill="#71717A" font-size="13">create_pr · list_issues · get_file · 9 tools</text>

      <text x="30" y="332" fill="#6EE7B7">●</text><text x="56" y="332" fill="#FAFAF7" font-size="17">postgres</text>
      <text x="540" y="332" fill="#6EE7B7" font-size="14">connected</text>
      <text x="56" y="358" fill="#71717A" font-size="13">query · list_tables · describe · 3 tools</text>

      <line x1="30" y1="396" x2="670" y2="396" stroke="#1A1F24" stroke-width="1"/>
      <text x="30" y="430" fill="#AAA79A">3 servers · </text><text x="170" y="430" fill="#FAFAF7">17 tools available</text>
      <text x="30" y="468" fill="#6EE7B7">❯</text><text x="56" y="468" fill="#71717A">_</text>
    </g>
    <text x="30" y="588" fill="#71717A" font-size="13">Live connection state. Three on disk → three connected.</text>
  </g>

  <text x="80" y="866" fill="#71717A" font-size="13">If <tspan font-family="JetBrains Mono, monospace" fill="#FAFAF7">/mcp</tspan> shows fewer servers than the file, the missing one failed auth or has a bad command — fix it before you build.</text>
</svg>
