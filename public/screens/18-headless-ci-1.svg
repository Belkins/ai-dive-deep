<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>
  <text x="80" y="60" fill="#FF6B2C" font-size="15" letter-spacing="6" font-weight="500">CHAPTER 18 · COST DISCIPLINE AT SCALE</text>
  <text x="80" y="118" fill="#FAFAF7" font-size="50" font-weight="500" font-family="Source Serif 4, Georgia, serif" letter-spacing="-1">A headless run, billed per cent</text>
  <text x="80" y="154" fill="#AAA79A" font-size="18"><tspan font-family="JetBrains Mono, monospace" fill="#E5E5E5">claude --print</tspan> in CI. Six steps, a few cents, and the cost echoed in the log — caught before finance sees the invoice.</text>
  <text x="1520" y="60" fill="#71717A" font-size="11" letter-spacing="3" text-anchor="end">GITHUB ACTIONS · RUN LOG</text>

  <!-- GHA window -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="1440" height="620" fill="#14181C" stroke="#2A3138" stroke-width="1" rx="10"/>
    <rect x="0" y="0" width="1440" height="56" fill="#1A1F24" rx="10"/>
    <rect x="0" y="28" width="1440" height="28" fill="#1A1F24"/>
    <circle cx="34" cy="28" r="9" fill="#6EE7B7"/>
    <text x="58" y="34" fill="#FAFAF7" font-size="17" font-weight="600">Daily PR Digest</text>
    <text x="260" y="34" fill="#71717A" font-size="14">#218 · main · cron 0 14 * * 1-5</text>
    <text x="1416" y="34" fill="#6EE7B7" font-size="14" text-anchor="end">✓ Success · 41s</text>

    <!-- job header -->
    <text x="32" y="100" fill="#FAFAF7" font-size="16" font-weight="600">digest</text>
    <text x="120" y="100" fill="#71717A" font-size="14" font-family="JetBrains Mono, monospace">ubuntu-latest</text>
    <text x="1408" y="100" fill="#6EE7B7" font-size="14" text-anchor="end">✓ 41s</text>
    <line x1="32" y1="120" x2="1408" y2="120" stroke="#2A3138" stroke-width="1"/>

    <!-- steps -->
    <g font-family="JetBrains Mono, monospace" font-size="15">
      <text x="40" y="160" fill="#6EE7B7">✓</text><text x="70" y="160" fill="#E5E5E5">Set up job</text>                                  <text x="1400" y="160" fill="#71717A" text-anchor="end">2s</text>
      <text x="40" y="198" fill="#6EE7B7">✓</text><text x="70" y="198" fill="#E5E5E5">actions/checkout@v4</text>                          <text x="1400" y="198" fill="#71717A" text-anchor="end">3s</text>
      <text x="40" y="236" fill="#6EE7B7">✓</text><text x="70" y="236" fill="#E5E5E5">npm install -g @anthropic-ai/claude-code</text>     <text x="1400" y="236" fill="#71717A" text-anchor="end">11s</text>
      <text x="40" y="274" fill="#6EE7B7">✓</text><text x="70" y="274" fill="#E5E5E5">claude --print "Summarize PRs…" --allowed-tools …</text> <text x="1400" y="274" fill="#71717A" text-anchor="end">22s</text>
      <text x="40" y="312" fill="#6EE7B7">✓</text><text x="70" y="312" fill="#E5E5E5">curl → Slack webhook</text>                          <text x="1400" y="312" fill="#71717A" text-anchor="end">1s</text>
      <text x="40" y="350" fill="#6EE7B7">✓</text><text x="70" y="350" fill="#E5E5E5">Complete job</text>                                 <text x="1400" y="350" fill="#71717A" text-anchor="end">2s</text>
    </g>
    <line x1="32" y1="378" x2="1408" y2="378" stroke="#2A3138" stroke-width="1"/>

    <!-- expanded step: the claude --print output -->
    <text x="32" y="414" fill="#71717A" font-size="12" letter-spacing="2" font-weight="600">▾ claude --print  ·  --output-format json</text>
    <rect x="32" y="430" width="1376" height="150" fill="#0B0D0F" stroke="#2A3138" stroke-width="1" rx="8"/>
    <g font-family="JetBrains Mono, monospace" font-size="14">
      <text x="52" y="462" fill="#71717A">$ claude --print "Summarize PRs merged in the last 24h…" \</text>
      <text x="52" y="486" fill="#71717A">    --allowed-tools "Bash(gh*),Read,Grep" --output-format json</text>
      <text x="52" y="520" fill="#E5E5E5">{ "result": "12 PRs across 4 areas…",</text>
      <text x="72" y="544" fill="#E5E5E5">"duration_ms": 21640,</text>
      <text x="72" y="568" fill="#6EE7B7">"total_cost_usd": 0.038 }</text>
    </g>
  </g>

  <text x="80" y="866" fill="#71717A" font-size="13">Six steps. <tspan fill="#6EE7B7" font-family="JetBrains Mono, monospace">total_cost_usd: 0.038</tspan> — a few cents per run, parsed to a dashboard. A prompt regression shows up here before it shows up on the invoice.</text>
</svg>
