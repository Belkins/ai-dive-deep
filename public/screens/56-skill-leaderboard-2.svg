<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>
  <text x="80.0" y="84.0" fill="#F4F1EA" font-size="50" font-weight="700" text-anchor="start">From 700 to 9</text>
  <text x="80.0" y="134.0" fill="#9A9789" font-size="26" font-weight="400" text-anchor="start">What happened to the ranked repos between the board and my machine, 1 October 2026.</text>
  <text x="80.0" y="168.0" fill="#9A9789" font-size="26" font-weight="400" text-anchor="start">Bar length is the count, on one linear scale.</text>
  <rect x="470" y="232" width="1030.0" height="62" rx="6" fill="#9A9789" fill-opacity="0.55"/>
  <text x="446.0" y="276.0" fill="#F4F1EA" font-size="40" font-weight="700" text-anchor="end">700</text>
  <text x="492.0" y="260.0" fill="#F4F1EA" font-size="25" font-weight="600" text-anchor="start">ranked on the board</text>
  <text x="492.0" y="286.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="start">snapshot 2026-10-01</text>
  <rect x="470" y="324" width="254.6" height="62" rx="6" fill="#9A9789" fill-opacity="0.55"/>
  <text x="446.0" y="368.0" fill="#F4F1EA" font-size="40" font-weight="700" text-anchor="end">173</text>
  <text x="742.6" y="352.0" fill="#F4F1EA" font-size="25" font-weight="600" text-anchor="start">shortlisted by code</text>
  <text x="742.6" y="378.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="start">stars, 7-day gain, traction, new, fit to my stack</text>
  <rect x="470" y="416" width="173.6" height="62" rx="6" fill="#C9C3B3" fill-opacity="0.55"/>
  <text x="446.0" y="460.0" fill="#F4F1EA" font-size="40" font-weight="700" text-anchor="end">118</text>
  <text x="661.6" y="444.0" fill="#F4F1EA" font-size="25" font-weight="600" text-anchor="start">read from source by 9 lanes</text>
  <text x="661.6" y="470.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="start">120 repos cloned, media left out</text>
  <rect x="470" y="508" width="58.9" height="62" rx="6" fill="#C9C3B3" fill-opacity="0.55"/>
  <text x="446.0" y="552.0" fill="#F4F1EA" font-size="40" font-weight="700" text-anchor="end">40</text>
  <text x="546.9" y="536.0" fill="#F4F1EA" font-size="25" font-weight="600" text-anchor="start">picked by the lanes</text>
  <text x="546.9" y="562.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="start">adopt, trial or copy one skill; the rest skipped</text>
  <rect x="470" y="600" width="26.5" height="62" rx="6" fill="#FF6B2C" fill-opacity="0.9"/>
  <text x="446.0" y="644.0" fill="#F4F1EA" font-size="40" font-weight="700" text-anchor="end">18</text>
  <text x="514.5" y="628.0" fill="#F4F1EA" font-size="25" font-weight="600" text-anchor="start">kept as-is by the red team</text>
  <text x="514.5" y="654.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="start">20 downgraded, 2 dropped</text>
  <rect x="470" y="692" width="7.4" height="62" rx="6" fill="#22D3A0" fill-opacity="0.9"/>
  <text x="446.0" y="736.0" fill="#F4F1EA" font-size="40" font-weight="700" text-anchor="end">5</text>
  <text x="495.4" y="720.0" fill="#F4F1EA" font-size="25" font-weight="600" text-anchor="start">repos installed the same night</text>
  <text x="495.4" y="746.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="start">9 skills and plugins, each pinned to the commit a vetter read</text>
</svg>
