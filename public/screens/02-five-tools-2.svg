<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>

  <text x="80" y="60" fill="#FF6B2C" font-size="15" letter-spacing="6" font-weight="500">CHAPTER 2 · THE TOKEN MATH</text>
  <text x="80" y="118" fill="#FAFAF7" font-size="50" font-weight="500" font-family="Source Serif 4, Georgia, serif" letter-spacing="-1">What a 2.2-billion-token month costs</text>
  <text x="80" y="154" fill="#AAA79A" font-size="18">A real Anthropic invoice: billions of tokens, a four-figure total. The cheapest senior hire I've ever made.</text>
  <text x="1520" y="60" fill="#71717A" font-size="11" letter-spacing="3" text-anchor="end">ANTHROPIC CONSOLE · APRIL 2026</text>

  <!-- Metric cards -->
  <g transform="translate(80, 196)">
    <rect x="0" y="0" width="345" height="118" fill="#161B1F" stroke="#FF6B2C" stroke-width="1" rx="8"/>
    <text x="22" y="34" fill="#71717A" font-size="12" letter-spacing="2">TOTAL TOKEN COST</text>
    <text x="22" y="84" fill="#FAFAF7" font-size="44" font-weight="500" font-family="Source Serif 4, Georgia, serif">$2,216.00</text>

    <rect x="365" y="0" width="345" height="118" fill="#161B1F" stroke="#2A3138" stroke-width="1" rx="8"/>
    <text x="387" y="34" fill="#71717A" font-size="12" letter-spacing="2">TOKENS IN (MONTH)</text>
    <text x="387" y="84" fill="#FAFAF7" font-size="44" font-weight="500" font-family="Source Serif 4, Georgia, serif">~2.2B</text>

    <rect x="730" y="0" width="345" height="118" fill="#161B1F" stroke="#2A3138" stroke-width="1" rx="8"/>
    <text x="752" y="34" fill="#71717A" font-size="12" letter-spacing="2">WEB · CODE · SESSION</text>
    <text x="752" y="84" fill="#FAFAF7" font-size="44" font-weight="500" font-family="Source Serif 4, Georgia, serif">$0.00</text>

    <rect x="1095" y="0" width="345" height="118" fill="#0F1A14" stroke="#6EE7B7" stroke-width="1" rx="8"/>
    <text x="1117" y="34" fill="#6EE7B7" font-size="12" letter-spacing="2">VS A $120K/YR HIRE</text>
    <text x="1117" y="78" fill="#FAFAF7" font-size="30" font-weight="500" font-family="Source Serif 4, Georgia, serif">5–10× the work</text>
  </g>

  <!-- Daily cost bar chart -->
  <text x="80" y="368" fill="#6EE7B7" font-size="11" letter-spacing="2.4" font-weight="600">DAILY TOKEN COST · DECAYING AS OPTIMIZATION LANDS (~$220 → ~$50)</text>
