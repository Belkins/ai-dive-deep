  <text x="90" y="824" fill="#71717A" font-size="12">Apr 01</text>
  <text x="760" y="824" fill="#71717A" font-size="12">Apr 15</text>
  <text x="1470" y="824" fill="#71717A" font-size="12" text-anchor="end">Apr 30</text>

  <text x="80" y="866" fill="#71717A" font-size="13">A $120K/yr engineer buys ~24B Sonnet-input tokens. This month ran 2.2B for <tspan fill="#FAFAF7">$2,216</tspan> — and ran the swarm while you slept.</text>
