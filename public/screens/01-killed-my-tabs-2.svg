<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>

  <!-- Window chrome -->
  <rect x="60" y="40" width="1480" height="820" fill="#161B1F" stroke="#26251F" stroke-width="1" rx="10"/>
  <rect x="60" y="40" width="1480" height="44" fill="#1A1B1F" rx="10"/>
  <rect x="60" y="70" width="1480" height="14" fill="#1A1B1F"/>
  <circle cx="84" cy="62" r="6" fill="#FF5F57"/>
  <circle cx="104" cy="62" r="6" fill="#FEBC2E"/>
  <circle cx="124" cy="62" r="6" fill="#28C840"/>
  <text x="760" y="66" fill="#71717A" font-size="13" text-anchor="middle" font-family="JetBrains Mono, monospace">Cowork · Scheduled Tasks</text>

  <!-- Title -->
  <text x="100" y="130" fill="#FAFAF7" font-size="28" font-weight="500" font-family="Source Serif 4, Georgia, serif">Scheduled tasks — what runs while I sleep</text>
  <text x="100" y="160" fill="#AAA79A" font-size="14">Cron-style cards. Each one is a SKILL.md invoked at a fixed cadence. The output lands in #ops.</text>

  <!-- 4 columns × 3 rows = 12 cards. Card: 330 wide × 200 tall, gap 30 -->
  <!-- Total height (with header at 200): 200 + 3×200 + 2×30 = 860. Fits at 900. -->
  <!-- Cadence badge: width=200, x=20, text centered at x=120 — plenty of room. -->

  <g transform="translate(95, 200)">
    <!-- ROW 1 -->

    <!-- Card 1: Portfolio daily briefing -->
    <g>
      <rect x="0" y="0" width="330" height="200" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
      <text x="20" y="36" fill="#FAFAF7" font-size="16" font-weight="500">Portfolio daily briefing</text>
      <text x="20" y="64" fill="#AAA79A" font-size="12">Belkins · Folderly · LinguaLive ·</text>
      <text x="20" y="82" fill="#AAA79A" font-size="12">Diagnostics venture. Each company gets a 4-bullet</text>
      <text x="20" y="100" fill="#AAA79A" font-size="12">summary — pipeline / burn / wins / fires.</text>
      <rect x="20" y="150" width="200" height="26" rx="13" fill="#22D3A0" fill-opacity="0.15" stroke="#22D3A0" stroke-width="1"/>
      <text x="120" y="168" fill="#22D3A0" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Weekdays  ·  7:00 ET</text>
    </g>

    <!-- Card 2: Pipeline heartbeat -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="330" height="200" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
      <text x="20" y="36" fill="#FAFAF7" font-size="16" font-weight="500">Pipeline heartbeat</text>
      <text x="20" y="64" fill="#AAA79A" font-size="12">HubSpot deal motion + Gong call signals →</text>
      <text x="20" y="82" fill="#AAA79A" font-size="12">flags deals quiet &gt;4 days at stage 3+.</text>
      <text x="20" y="100" fill="#AAA79A" font-size="12">SDR ramp progress vs week-2 cohort.</text>
      <rect x="20" y="150" width="200" height="26" rx="13" fill="#22D3A0" fill-opacity="0.15" stroke="#22D3A0" stroke-width="1"/>
      <text x="120" y="168" fill="#22D3A0" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Daily  ·  7:30 ET</text>
    </g>

    <!-- Card 3: Folderly Stripe revenue -->
    <g transform="translate(720, 0)">
      <rect x="0" y="0" width="330" height="200" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
      <text x="20" y="36" fill="#FAFAF7" font-size="16" font-weight="500">Folderly Stripe revenue</text>
      <text x="20" y="64" fill="#AAA79A" font-size="12">MRR delta vs last week. New signups,</text>
      <text x="20" y="82" fill="#AAA79A" font-size="12">churned accounts (with reason if logged),</text>
      <text x="20" y="100" fill="#AAA79A" font-size="12">deliverability eval flags from skill suite.</text>
      <rect x="20" y="150" width="200" height="26" rx="13" fill="#22D3A0" fill-opacity="0.15" stroke="#22D3A0" stroke-width="1"/>
      <text x="120" y="168" fill="#22D3A0" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Mon &amp; Thu  ·  8:00 ET</text>
    </g>

    <!-- Card 4: partner-account pulse -->
    <g transform="translate(1080, 0)">
      <rect x="0" y="0" width="330" height="200" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
      <text x="20" y="36" fill="#FAFAF7" font-size="16" font-weight="500">Partner-account pulse</text>
      <text x="20" y="64" fill="#AAA79A" font-size="12">Tracks a large partner-seat motion.</text>
      <text x="20" y="82" fill="#AAA79A" font-size="12">Surfaces stalled outreach, week-1 conversion,</text>
      <text x="20" y="100" fill="#AAA79A" font-size="12">solo-LO replies that need a human follow-up.</text>
      <rect x="20" y="150" width="200" height="26" rx="13" fill="#22D3A0" fill-opacity="0.15" stroke="#22D3A0" stroke-width="1"/>
      <text x="120" y="168" fill="#22D3A0" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Tue &amp; Fri  ·  9:00 ET</text>
    </g>

    <!-- ROW 2 -->

    <!-- Card 5: Agency memory sync -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="330" height="200" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
      <text x="20" y="36" fill="#FAFAF7" font-size="16" font-weight="500">Agency memory sync</text>
      <text x="20" y="64" fill="#AAA79A" font-size="12">Weekly digest from Telegram chat logs.</text>
      <text x="20" y="82" fill="#AAA79A" font-size="12">Writes to vault. Surfaces new model</text>
      <text x="20" y="100" fill="#AAA79A" font-size="12">requests + SociaVault scrape anomalies.</text>
      <rect x="20" y="150" width="200" height="26" rx="13" fill="#22D3A0" fill-opacity="0.15" stroke="#22D3A0" stroke-width="1"/>
      <text x="120" y="168" fill="#22D3A0" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Fridays  ·  8:00 PM ET</text>
    </g>

    <!-- Card 6: Friday wrapup -->
    <g transform="translate(360, 230)">
      <rect x="0" y="0" width="330" height="200" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
      <text x="20" y="36" fill="#FAFAF7" font-size="16" font-weight="500">Friday wrapup</text>
      <text x="20" y="64" fill="#AAA79A" font-size="12">Portfolio-wide weekly reflection. Aggregates</text>
      <text x="20" y="82" fill="#AAA79A" font-size="12">Mon-Fri across 5 companies. ~400 words,</text>
      <text x="20" y="100" fill="#AAA79A" font-size="12">drops in #ops as a single canvas.</text>
      <rect x="20" y="150" width="200" height="26" rx="13" fill="#22D3A0" fill-opacity="0.15" stroke="#22D3A0" stroke-width="1"/>
      <text x="120" y="168" fill="#22D3A0" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Fridays  ·  5:00 PM ET</text>
    </g>

    <!-- Card 7: Competitive intel scan -->
    <g transform="translate(720, 230)">
      <rect x="0" y="0" width="330" height="200" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
      <text x="20" y="36" fill="#FAFAF7" font-size="16" font-weight="500">Competitive intel scan</text>
      <text x="20" y="64" fill="#AAA79A" font-size="12">Belkins (B2B lead-gen) + Folderly</text>
      <text x="20" y="82" fill="#AAA79A" font-size="12">(deliverability). Tracks pricing pages, blog</text>
      <text x="20" y="100" fill="#AAA79A" font-size="12">cadence, hiring signals on top 8 competitors.</text>
      <rect x="20" y="150" width="200" height="26" rx="13" fill="#22D3A0" fill-opacity="0.15" stroke="#22D3A0" stroke-width="1"/>
      <text x="120" y="168" fill="#22D3A0" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Sundays  ·  6:00 PM ET</text>
    </g>

    <!-- Card 8: Newsletter idea harvester -->
    <g transform="translate(1080, 230)">
      <rect x="0" y="0" width="330" height="200" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
      <text x="20" y="36" fill="#FAFAF7" font-size="16" font-weight="500">Newsletter idea harvester</text>
      <text x="20" y="64" fill="#AAA79A" font-size="12">Scans 7 days of vault notes + Slack rants</text>
      <text x="20" y="82" fill="#AAA79A" font-size="12">+ Substack drafts. Surfaces top 3 ideas for</text>
      <text x="20" y="100" fill="#AAA79A" font-size="12">next issue, ranked by recurrence.</text>
      <rect x="20" y="150" width="200" height="26" rx="13" fill="#22D3A0" fill-opacity="0.15" stroke="#22D3A0" stroke-width="1"/>
      <text x="120" y="168" fill="#22D3A0" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Sundays  ·  7:00 PM ET</text>
    </g>

    <!-- ROW 3 -->

    <!-- Card 9: Follow-up reminder -->
    <g transform="translate(0, 460)">
      <rect x="0" y="0" width="330" height="200" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
      <text x="20" y="36" fill="#FAFAF7" font-size="16" font-weight="500">Follow-up reminder</text>
      <text x="20" y="64" fill="#AAA79A" font-size="12">Daily scan of Slack DMs, Calendar, HubSpot,</text>
      <text x="20" y="82" fill="#AAA79A" font-size="12">email for open commitments. Surfaces what</text>
      <text x="20" y="100" fill="#AAA79A" font-size="12">slipped, what's due in 48h. Output: -1.svg.</text>
      <rect x="20" y="150" width="200" height="26" rx="13" fill="#22D3A0" fill-opacity="0.15" stroke="#22D3A0" stroke-width="1"/>
      <text x="120" y="168" fill="#22D3A0" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Weekdays  ·  8:00 ET</text>
    </g>

    <!-- Card 10: Folderly cron health -->
    <g transform="translate(360, 460)">
      <rect x="0" y="0" width="330" height="200" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
      <text x="20" y="36" fill="#FAFAF7" font-size="16" font-weight="500">Folderly cron health</text>
      <text x="20" y="64" fill="#AAA79A" font-size="12">Pings the deliverability eval skill across 6</text>
      <text x="20" y="82" fill="#AAA79A" font-size="12">monitored domains. Flags SPF/DKIM/DMARC drift</text>
      <text x="20" y="100" fill="#AAA79A" font-size="12">before the next cadence fires.</text>
      <rect x="20" y="150" width="200" height="26" rx="13" fill="#22D3A0" fill-opacity="0.15" stroke="#22D3A0" stroke-width="1"/>
      <text x="120" y="168" fill="#22D3A0" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Daily  ·  6:30 AM ET</text>
    </g>

    <!-- Card 11: Diagnostics venture research scan (replaces mentorship) -->
    <g transform="translate(720, 460)">
      <rect x="0" y="0" width="330" height="200" fill="#1A1B1F" stroke="#26251F" stroke-width="1" rx="8"/>
      <text x="20" y="36" fill="#FAFAF7" font-size="16" font-weight="500">Diagnostics venture research scan</text>
      <text x="20" y="64" fill="#AAA79A" font-size="12">Pulls new oncology preprints from arXiv +</text>
      <text x="20" y="82" fill="#AAA79A" font-size="12">bioRxiv against our screening rubric. Flags</text>
      <text x="20" y="100" fill="#AAA79A" font-size="12">grant matches + collaboration candidates.</text>
      <rect x="20" y="150" width="200" height="26" rx="13" fill="#22D3A0" fill-opacity="0.15" stroke="#22D3A0" stroke-width="1"/>
      <text x="120" y="168" fill="#22D3A0" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Mondays  ·  6:00 AM ET</text>
    </g>

    <!-- Card 12: Anthropic billing watch (the operator load-bearing one — accent border) -->
    <g transform="translate(1080, 460)">
      <rect x="0" y="0" width="330" height="200" fill="#1A1B1F" stroke="#FF6B2C" stroke-width="1.5" rx="8"/>
      <text x="20" y="36" fill="#FAFAF7" font-size="16" font-weight="500">Anthropic billing watch</text>
      <text x="20" y="64" fill="#AAA79A" font-size="12">Daily spend &gt; $80 OR 2.5× median triggers a</text>
      <text x="20" y="82" fill="#AAA79A" font-size="12">Slack ping with the 3 most-likely culprits</text>
      <text x="20" y="100" fill="#AAA79A" font-size="12">(cache hit rate, headless run, eval gate).</text>
      <rect x="20" y="150" width="200" height="26" rx="13" fill="#FF6B2C" fill-opacity="0.15" stroke="#FF6B2C" stroke-width="1"/>
      <text x="120" y="168" fill="#FF6B2C" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Daily  ·  9:00 ET</text>
    </g>
  </g>

  <text x="1520" y="880" fill="#3F3F46" font-size="11" text-anchor="end" font-family="JetBrains Mono, monospace">dive.vladyslavpodoliako.com · Ch 1 · sanitized example · orange border = cost-control workflow</text>
</svg>
