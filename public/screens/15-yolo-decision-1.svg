<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>

  <!-- Header -->
  <text x="80" y="64" fill="#FF6B2C" font-size="14" letter-spacing="6" font-weight="500">CHAPTER 15 · THE FOUR GATES</text>
  <text x="80" y="124" fill="#FAFAF7" font-size="46" font-weight="500" font-family="Source Serif 4, Georgia, serif" letter-spacing="-1">Should I type --dangerously-skip-permissions here?</text>
  <text x="80" y="160" fill="#AAA79A" font-size="17">Four yeses, type the flag. One no, type <tspan font-family="JetBrains Mono, monospace" fill="#FAFAF7">--auto</tspan> instead — or fix what's failing, then come back.</text>

  <!-- Top-right meta -->
  <text x="1520" y="64" fill="#71717A" font-size="11" letter-spacing="3" text-anchor="end">DECISION TREE · MAY 2026</text>

  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6EE7B7"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF6B2C"/>
    </marker>
  </defs>

  <!-- ============== GATE 1 ============== -->
  <g transform="translate(80, 210)">
    <!-- Number circle -->
    <circle cx="40" cy="60" r="40" fill="#1F2429" stroke="#6EE7B7" stroke-width="2"/>
    <text x="40" y="74" fill="#6EE7B7" font-size="34" font-weight="500" font-family="Source Serif 4, Georgia, serif" text-anchor="middle">1</text>
    <!-- Question card -->
    <rect x="100" y="0" width="820" height="120" fill="#161B1F" stroke="#2A3138" stroke-width="1" rx="8"/>
    <text x="124" y="32" fill="#6EE7B7" font-size="10" letter-spacing="2.4" font-weight="600">GATE 1 · ENVIRONMENT</text>
    <text x="124" y="68" fill="#FAFAF7" font-size="22" font-weight="500">Is this a disposable environment?</text>
    <text x="124" y="98" fill="#AAA79A" font-size="14">Container, ephemeral VM, throwaway Codespace. "Rebuild it" should cost a minute, not a day.</text>
    <!-- YES arrow (down) -->
    <line x1="510" y1="120" x2="510" y2="160" stroke="#6EE7B7" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="520" y="145" fill="#6EE7B7" font-size="11" letter-spacing="2" font-weight="600">YES ↓</text>
    <!-- NO arrow (right) + action card -->
    <line x1="920" y1="60" x2="1000" y2="60" stroke="#FF6B2C" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="935" y="50" fill="#FF6B2C" font-size="11" letter-spacing="2" font-weight="600">NO →</text>
    <rect x="1010" y="20" width="430" height="80" fill="#1A1208" stroke="#FF6B2C" stroke-width="1" rx="8"/>
    <text x="1030" y="46" fill="#FF6B2C" font-size="10" letter-spacing="2" font-weight="600">CORRECTIVE</text>
    <text x="1030" y="72" fill="#FAFAF7" font-size="17" font-weight="500" font-family="JetBrains Mono, monospace">Get into a sandbox first</text>
    <text x="1030" y="90" fill="#AAA79A" font-size="12">Docker, devcontainer, e2b, Cowork — pick one.</text>
  </g>

  <!-- ============== GATE 2 ============== -->
  <g transform="translate(80, 380)">
    <circle cx="40" cy="60" r="40" fill="#1F2429" stroke="#6EE7B7" stroke-width="2"/>
    <text x="40" y="74" fill="#6EE7B7" font-size="34" font-weight="500" font-family="Source Serif 4, Georgia, serif" text-anchor="middle">2</text>
    <rect x="100" y="0" width="820" height="120" fill="#161B1F" stroke="#2A3138" stroke-width="1" rx="8"/>
    <text x="124" y="32" fill="#6EE7B7" font-size="10" letter-spacing="2.4" font-weight="600">GATE 2 · CREDENTIALS</text>
    <text x="124" y="68" fill="#FAFAF7" font-size="22" font-weight="500">No real credentials reachable from this filesystem?</text>
    <text x="124" y="98" fill="#AAA79A" font-size="14">No <tspan font-family="JetBrains Mono, monospace" fill="#E5E5E5">~/.aws</tspan>, <tspan font-family="JetBrains Mono, monospace" fill="#E5E5E5">~/.config/gcloud</tspan>, <tspan font-family="JetBrains Mono, monospace" fill="#E5E5E5">~/.kube</tspan>, <tspan font-family="JetBrains Mono, monospace" fill="#E5E5E5">~/.ssh</tspan>, no real <tspan font-family="JetBrains Mono, monospace" fill="#E5E5E5">.env</tspan>. Test keys only.</text>
    <line x1="510" y1="120" x2="510" y2="160" stroke="#6EE7B7" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="520" y="145" fill="#6EE7B7" font-size="11" letter-spacing="2" font-weight="600">YES ↓</text>
    <line x1="920" y1="60" x2="1000" y2="60" stroke="#FF6B2C" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="935" y="50" fill="#FF6B2C" font-size="11" letter-spacing="2" font-weight="600">NO →</text>
    <rect x="1010" y="20" width="430" height="80" fill="#1A1208" stroke="#FF6B2C" stroke-width="1" rx="8"/>
    <text x="1030" y="46" fill="#FF6B2C" font-size="10" letter-spacing="2" font-weight="600">CORRECTIVE</text>
    <text x="1030" y="72" fill="#FAFAF7" font-size="17" font-weight="500" font-family="JetBrains Mono, monospace">claude --auto</text>
    <text x="1030" y="90" fill="#AAA79A" font-size="12">Classifier in the loop. 17% miss rate, still beats YOLO.</text>
  </g>

  <!-- ============== GATE 3 ============== -->
  <g transform="translate(80, 550)">
    <circle cx="40" cy="60" r="40" fill="#1F2429" stroke="#6EE7B7" stroke-width="2"/>
    <text x="40" y="74" fill="#6EE7B7" font-size="34" font-weight="500" font-family="Source Serif 4, Georgia, serif" text-anchor="middle">3</text>
    <rect x="100" y="0" width="820" height="120" fill="#161B1F" stroke="#2A3138" stroke-width="1" rx="8"/>
    <text x="124" y="32" fill="#6EE7B7" font-size="10" letter-spacing="2.4" font-weight="600">GATE 3 · NETWORK</text>
    <text x="124" y="68" fill="#FAFAF7" font-size="22" font-weight="500">Network egress blocked or allowlisted?</text>
    <text x="124" y="98" fill="#AAA79A" font-size="14"><tspan font-family="JetBrains Mono, monospace" fill="#E5E5E5">--network none</tspan>, or a domain allowlist. If the agent can reach Stripe / your CRM with real keys, you have no containment.</text>
    <line x1="510" y1="120" x2="510" y2="160" stroke="#6EE7B7" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="520" y="145" fill="#6EE7B7" font-size="11" letter-spacing="2" font-weight="600">YES ↓</text>
    <line x1="920" y1="60" x2="1000" y2="60" stroke="#FF6B2C" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="935" y="50" fill="#FF6B2C" font-size="11" letter-spacing="2" font-weight="600">NO →</text>
    <rect x="1010" y="20" width="430" height="80" fill="#1A1208" stroke="#FF6B2C" stroke-width="1" rx="8"/>
    <text x="1030" y="46" fill="#FF6B2C" font-size="10" letter-spacing="2" font-weight="600">CORRECTIVE</text>
    <text x="1030" y="72" fill="#FAFAF7" font-size="17" font-weight="500" font-family="JetBrains Mono, monospace">docker run --network none</text>
    <text x="1030" y="90" fill="#AAA79A" font-size="12">Or egress firewall — see the official devcontainer.</text>
  </g>

  <!-- ============== GATE 4 ============== -->
  <g transform="translate(80, 720)">
    <circle cx="40" cy="60" r="40" fill="#1F2429" stroke="#6EE7B7" stroke-width="2"/>
    <text x="40" y="74" fill="#6EE7B7" font-size="34" font-weight="500" font-family="Source Serif 4, Georgia, serif" text-anchor="middle">4</text>
    <rect x="100" y="0" width="820" height="120" fill="#161B1F" stroke="#2A3138" stroke-width="1" rx="8"/>
    <text x="124" y="32" fill="#6EE7B7" font-size="10" letter-spacing="2.4" font-weight="600">GATE 4 · RECOVERY</text>
    <text x="124" y="68" fill="#FAFAF7" font-size="22" font-weight="500">Recoverable from a one-minute-ago state?</text>
    <text x="124" y="98" fill="#AAA79A" font-size="14">Git committed, snapshot taken, branch pushed. Worst case: discard the worktree and start over.</text>
    <!-- YES arrow points to the terminus on the right -->
    <line x1="920" y1="60" x2="1000" y2="60" stroke="#6EE7B7" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="935" y="50" fill="#6EE7B7" font-size="11" letter-spacing="2" font-weight="600">YES →</text>
    <!-- Terminus card (replaces the NO action — different aesthetic since this is the GO) -->
    <rect x="1010" y="20" width="430" height="80" fill="#0F1A14" stroke="#6EE7B7" stroke-width="2" rx="8"/>
    <text x="1030" y="46" fill="#6EE7B7" font-size="10" letter-spacing="2" font-weight="600">SAFE — TYPE THE FLAG</text>
    <text x="1030" y="74" fill="#FAFAF7" font-size="15" font-weight="500" font-family="JetBrains Mono, monospace">claude --dangerously-skip-permissions</text>
    <text x="1030" y="92" fill="#6EE7B7" font-size="12">All four gates clear. Go fast.</text>
  </g>

  <!-- Footer caption -->
  <text x="80" y="876" fill="#71717A" font-size="13">If you can't list what's in scope from memory at Gate 2 or Gate 3, the answer is NO — you don't actually know.</text>
</svg>
