<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>

  <text x="80" y="90" fill="#FF6B2C" font-size="18" letter-spacing="6" font-weight="500">SIX STAGES</text>
  <text x="80" y="160" fill="#FAFAF7" font-size="56" font-weight="500" font-family="Source Serif 4, Georgia, serif" letter-spacing="-1">Idea to deployed URL</text>
  <text x="80" y="200" fill="#AAA79A" font-size="20">skipping stages is faster · skipping stages is also how Saturdays die</text>

  <!-- 6 stage cards in a horizontal flow -->
  <g transform="translate(80, 340)">
    <!-- Stage 1: Ideation -->
    <g>
      <rect x="0" y="0" width="220" height="200" fill="#161B1F" stroke="#FF6B2C" stroke-width="1.5" rx="10"/>
      <text x="20" y="34" fill="#FF6B2C" font-size="40" font-weight="500" font-family="Source Serif 4, Georgia, serif">01</text>
      <text x="20" y="80" fill="#FAFAF7" font-size="22" font-weight="500" font-family="Source Serif 4, Georgia, serif">Ideation</text>
      <line x1="20" y1="98" x2="200" y2="98" stroke="#26251F"/>
      <text x="20" y="125" fill="#AAA79A" font-size="13">deliverable:</text>
      <text x="20" y="146" fill="#FAFAF7" font-size="14">1-sentence brief</text>
      <text x="20" y="180" fill="#71717A" font-size="12" font-style="italic">"the thing in one line"</text>
    </g>

    <!-- Arrow 1 -->
    <text x="230" y="120" fill="#FF8E54" font-size="20">→</text>

    <!-- Stage 2: Foundation -->
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="220" height="200" fill="#161B1F" stroke="#FF8E54" stroke-width="1.5" rx="10"/>
      <text x="20" y="34" fill="#FF8E54" font-size="40" font-weight="500" font-family="Source Serif 4, Georgia, serif">02</text>
      <text x="20" y="80" fill="#FAFAF7" font-size="22" font-weight="500" font-family="Source Serif 4, Georgia, serif">Foundation</text>
      <line x1="20" y1="98" x2="200" y2="98" stroke="#26251F"/>
      <text x="20" y="125" fill="#AAA79A" font-size="13">deliverable:</text>
      <text x="20" y="146" fill="#FAFAF7" font-size="14">repo + CLAUDE.md</text>
      <text x="20" y="180" fill="#71717A" font-size="12" font-style="italic">"the spine"</text>
    </g>

    <!-- Arrow 2 -->
    <text x="490" y="120" fill="#FF8E54" font-size="20">→</text>

    <!-- Stage 3: Creation -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="220" height="200" fill="#161B1F" stroke="#FFB48C" stroke-width="1.5" rx="10"/>
      <text x="20" y="34" fill="#FFB48C" font-size="40" font-weight="500" font-family="Source Serif 4, Georgia, serif">03</text>
      <text x="20" y="80" fill="#FAFAF7" font-size="22" font-weight="500" font-family="Source Serif 4, Georgia, serif">Creation</text>
      <line x1="20" y1="98" x2="200" y2="98" stroke="#26251F"/>
      <text x="20" y="125" fill="#AAA79A" font-size="13">deliverable:</text>
      <text x="20" y="146" fill="#FAFAF7" font-size="14">first happy path</text>
      <text x="20" y="180" fill="#71717A" font-size="12" font-style="italic">"draft compiles"</text>
    </g>

    <!-- Arrow 3 -->
    <text x="750" y="120" fill="#FF8E54" font-size="20">→</text>

    <!-- Stage 4: Polishing -->
    <g transform="translate(780, 0)">
      <rect x="0" y="0" width="220" height="200" fill="#161B1F" stroke="#22D3A0" stroke-width="1.5" rx="10"/>
      <text x="20" y="34" fill="#22D3A0" font-size="40" font-weight="500" font-family="Source Serif 4, Georgia, serif">04</text>
      <text x="20" y="80" fill="#FAFAF7" font-size="22" font-weight="500" font-family="Source Serif 4, Georgia, serif">Polishing</text>
      <line x1="20" y1="98" x2="200" y2="98" stroke="#26251F"/>
      <text x="20" y="125" fill="#AAA79A" font-size="13">deliverable:</text>
      <text x="20" y="146" fill="#FAFAF7" font-size="14">edge cases handled</text>
      <text x="20" y="180" fill="#71717A" font-size="12" font-style="italic">"the polish, no shine"</text>
    </g>

    <!-- Arrow 4 -->
    <text x="1010" y="120" fill="#FF8E54" font-size="20">→</text>

    <!-- Stage 5: Security -->
    <g transform="translate(1040, 0)">
      <rect x="0" y="0" width="220" height="200" fill="#161B1F" stroke="#56544B" stroke-width="1.5" rx="10"/>
      <text x="20" y="34" fill="#56544B" font-size="40" font-weight="500" font-family="Source Serif 4, Georgia, serif">05</text>
      <text x="20" y="80" fill="#FAFAF7" font-size="22" font-weight="500" font-family="Source Serif 4, Georgia, serif">Security</text>
      <line x1="20" y1="98" x2="200" y2="98" stroke="#26251F"/>
      <text x="20" y="125" fill="#AAA79A" font-size="13">deliverable:</text>
      <text x="20" y="146" fill="#FAFAF7" font-size="14">secrets · permissions</text>
      <text x="20" y="180" fill="#71717A" font-size="12" font-style="italic">"don't get owned"</text>
    </g>

    <!-- Arrow 5 -->
    <text x="1270" y="120" fill="#FF8E54" font-size="20">→</text>

    <!-- Stage 6: Deploy -->
    <g transform="translate(1300, 0)">
      <rect x="0" y="0" width="220" height="200" fill="#1A1B1F" stroke="#FF6B2C" stroke-width="2" rx="10"/>
      <text x="20" y="34" fill="#FF6B2C" font-size="40" font-weight="600" font-family="Source Serif 4, Georgia, serif">06</text>
      <text x="20" y="80" fill="#FAFAF7" font-size="22" font-weight="500" font-family="Source Serif 4, Georgia, serif">Deploy</text>
      <line x1="20" y1="98" x2="200" y2="98" stroke="#26251F"/>
      <text x="20" y="125" fill="#AAA79A" font-size="13">deliverable:</text>
      <text x="20" y="146" fill="#FAFAF7" font-size="14">URL strangers see</text>
      <text x="20" y="180" fill="#71717A" font-size="12" font-style="italic">"shipped"</text>
    </g>
  </g>

  <!-- Failure rules below -->
  <g transform="translate(80, 660)">
    <rect x="0" y="0" width="1440" height="140" fill="#161B1F" stroke="#26251F" stroke-width="1" rx="10"/>
    <text x="30" y="40" fill="#22D3A0" font-size="14" letter-spacing="2">SKIP-A-STAGE FAILURE MODES</text>
    <text x="30" y="78" fill="#AAA79A" font-size="14">Skip Foundation → CLAUDE.md never written → every later stage costs 2x</text>
    <text x="30" y="104" fill="#AAA79A" font-size="14">Skip Polishing → edge cases ship to prod → Ch 28 failure receipts</text>
    <text x="30" y="130" fill="#AAA79A" font-size="14">Skip Security → an 11-minute Stripe-key leak (Ch 9) · the cost has been paid before</text>
  </g>

  <text x="1520" y="870" fill="#3F3F46" font-size="12" text-anchor="end" font-family="JetBrains Mono, monospace">dive.vladyslavpodoliako.com · Ch 31</text>
</svg>
