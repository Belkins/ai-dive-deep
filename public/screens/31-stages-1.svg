<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="stage-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF8E54"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0E0F11"/>

  <!-- Header -->
  <text x="80" y="90" fill="#FF6B2C" font-size="18" letter-spacing="6" font-weight="500">SIX STAGES</text>
  <text x="80" y="160" fill="#FAFAF7" font-size="56" font-weight="500" font-family="Source Serif 4, Georgia, serif" letter-spacing="-1">Idea to deployed URL</text>
  <text x="80" y="200" fill="#AAA79A" font-size="20">skipping stages is faster · skipping stages is also how Saturdays die</text>

  <!-- 6 stage cards in a horizontal flow.
       Total span: 80 → 1520 (1440px wide)
       6 cards × 220 wide = 1320
       5 gaps × 24 = 120
       Total = 1440 ✓ -->

  <!-- Connecting line behind cards (subtle backbone) -->
  <line x1="280" y1="450" x2="1320" y2="450" stroke="#26251F" stroke-width="2" stroke-dasharray="4 4"/>

  <g transform="translate(80, 340)">
    <!-- Stage 1: Ideation -->
    <g>
      <rect x="0" y="0" width="220" height="220" fill="#161B1F" stroke="#FF6B2C" stroke-width="1.5" rx="12"/>
      <text x="20" y="44" fill="#FF6B2C" font-size="42" font-weight="500" font-family="Source Serif 4, Georgia, serif">01</text>
      <text x="20" y="92" fill="#FAFAF7" font-size="22" font-weight="500" font-family="Source Serif 4, Georgia, serif">Ideation</text>
      <line x1="20" y1="110" x2="200" y2="110" stroke="#26251F"/>
      <text x="20" y="138" fill="#AAA79A" font-size="11" letter-spacing="1.5">DELIVERABLE</text>
      <text x="20" y="160" fill="#FAFAF7" font-size="14">1-sentence brief</text>
      <text x="20" y="196" fill="#71717A" font-size="12" font-style="italic">"the thing in one line"</text>
    </g>

    <!-- Arrow 1 → 2 -->
    <line x1="232" y1="110" x2="240" y2="110" stroke="#FF8E54" stroke-width="2.5" marker-end="url(#stage-arrow)"/>

    <!-- Stage 2: Foundation -->
    <g transform="translate(244, 0)">
      <rect x="0" y="0" width="220" height="220" fill="#161B1F" stroke="#FF8E54" stroke-width="1.5" rx="12"/>
      <text x="20" y="44" fill="#FF8E54" font-size="42" font-weight="500" font-family="Source Serif 4, Georgia, serif">02</text>
      <text x="20" y="92" fill="#FAFAF7" font-size="22" font-weight="500" font-family="Source Serif 4, Georgia, serif">Foundation</text>
      <line x1="20" y1="110" x2="200" y2="110" stroke="#26251F"/>
      <text x="20" y="138" fill="#AAA79A" font-size="11" letter-spacing="1.5">DELIVERABLE</text>
      <text x="20" y="160" fill="#FAFAF7" font-size="14">repo + CLAUDE.md</text>
      <text x="20" y="196" fill="#71717A" font-size="12" font-style="italic">"the spine"</text>
    </g>

    <!-- Arrow 2 → 3 -->
    <line x1="476" y1="110" x2="484" y2="110" stroke="#FF8E54" stroke-width="2.5" marker-end="url(#stage-arrow)"/>

    <!-- Stage 3: Creation -->
    <g transform="translate(488, 0)">
      <rect x="0" y="0" width="220" height="220" fill="#161B1F" stroke="#FFB48C" stroke-width="1.5" rx="12"/>
      <text x="20" y="44" fill="#FFB48C" font-size="42" font-weight="500" font-family="Source Serif 4, Georgia, serif">03</text>
      <text x="20" y="92" fill="#FAFAF7" font-size="22" font-weight="500" font-family="Source Serif 4, Georgia, serif">Creation</text>
      <line x1="20" y1="110" x2="200" y2="110" stroke="#26251F"/>
      <text x="20" y="138" fill="#AAA79A" font-size="11" letter-spacing="1.5">DELIVERABLE</text>
      <text x="20" y="160" fill="#FAFAF7" font-size="14">first happy path</text>
      <text x="20" y="196" fill="#71717A" font-size="12" font-style="italic">"draft compiles"</text>
    </g>

    <!-- Arrow 3 → 4 -->
    <line x1="720" y1="110" x2="728" y2="110" stroke="#FF8E54" stroke-width="2.5" marker-end="url(#stage-arrow)"/>

    <!-- Stage 4: Polishing -->
    <g transform="translate(732, 0)">
      <rect x="0" y="0" width="220" height="220" fill="#161B1F" stroke="#22D3A0" stroke-width="1.5" rx="12"/>
      <text x="20" y="44" fill="#22D3A0" font-size="42" font-weight="500" font-family="Source Serif 4, Georgia, serif">04</text>
      <text x="20" y="92" fill="#FAFAF7" font-size="22" font-weight="500" font-family="Source Serif 4, Georgia, serif">Polishing</text>
      <line x1="20" y1="110" x2="200" y2="110" stroke="#26251F"/>
      <text x="20" y="138" fill="#AAA79A" font-size="11" letter-spacing="1.5">DELIVERABLE</text>
      <text x="20" y="160" fill="#FAFAF7" font-size="14">edge cases handled</text>
      <text x="20" y="196" fill="#71717A" font-size="12" font-style="italic">"polish, no shine"</text>
    </g>

    <!-- Arrow 4 → 5 -->
    <line x1="964" y1="110" x2="972" y2="110" stroke="#FF8E54" stroke-width="2.5" marker-end="url(#stage-arrow)"/>

    <!-- Stage 5: Security -->
    <g transform="translate(976, 0)">
      <rect x="0" y="0" width="220" height="220" fill="#161B1F" stroke="#56544B" stroke-width="1.5" rx="12"/>
      <text x="20" y="44" fill="#AAA79A" font-size="42" font-weight="500" font-family="Source Serif 4, Georgia, serif">05</text>
      <text x="20" y="92" fill="#FAFAF7" font-size="22" font-weight="500" font-family="Source Serif 4, Georgia, serif">Security</text>
      <line x1="20" y1="110" x2="200" y2="110" stroke="#26251F"/>
      <text x="20" y="138" fill="#AAA79A" font-size="11" letter-spacing="1.5">DELIVERABLE</text>
      <text x="20" y="160" fill="#FAFAF7" font-size="14">secrets · permissions</text>
      <text x="20" y="196" fill="#71717A" font-size="12" font-style="italic">"don't get owned"</text>
    </g>

    <!-- Arrow 5 → 6 -->
    <line x1="1208" y1="110" x2="1216" y2="110" stroke="#FF8E54" stroke-width="2.5" marker-end="url(#stage-arrow)"/>

    <!-- Stage 6: Deploy (the destination, accent border + slightly elevated) -->
    <g transform="translate(1220, 0)">
      <rect x="0" y="0" width="220" height="220" fill="#1A1B1F" stroke="#FF6B2C" stroke-width="2.5" rx="12"/>
      <text x="20" y="44" fill="#FF6B2C" font-size="42" font-weight="600" font-family="Source Serif 4, Georgia, serif">06</text>
      <text x="20" y="92" fill="#FAFAF7" font-size="22" font-weight="500" font-family="Source Serif 4, Georgia, serif">Deploy</text>
      <line x1="20" y1="110" x2="200" y2="110" stroke="#FF6B2C" stroke-opacity="0.3"/>
      <text x="20" y="138" fill="#AAA79A" font-size="11" letter-spacing="1.5">DELIVERABLE</text>
      <text x="20" y="160" fill="#FAFAF7" font-size="14">URL strangers see</text>
      <text x="20" y="196" fill="#FF6B2C" font-size="12" font-style="italic">"shipped"</text>
    </g>
  </g>

  <!-- Failure rules below -->
  <g transform="translate(80, 700)">
    <rect x="0" y="0" width="1440" height="140" fill="#161B1F" stroke="#26251F" stroke-width="1" rx="10"/>
    <text x="30" y="38" fill="#22D3A0" font-size="13" letter-spacing="2">SKIP-A-STAGE FAILURE MODES</text>
    <text x="30" y="74" fill="#FAFAF7" font-size="15"><tspan fill="#FF8E54">Skip Foundation</tspan> → CLAUDE.md never written → every later stage costs 2×</text>
    <text x="30" y="102" fill="#FAFAF7" font-size="15"><tspan fill="#22D3A0">Skip Polishing</tspan> → edge cases ship to prod → Ch 28 failure receipts</text>
    <text x="30" y="130" fill="#FAFAF7" font-size="15"><tspan fill="#56544B">Skip Security</tspan> → an 11-minute Stripe-key leak (Ch 9) · the cost has been paid before</text>
  </g>

  <text x="1520" y="870" fill="#3F3F46" font-size="12" text-anchor="end" font-family="JetBrains Mono, monospace">dive.vladyslavpodoliako.com · Ch 31</text>
</svg>
