<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>

  <text x="80" y="60" fill="#FF6B2C" font-size="15" letter-spacing="6" font-weight="500">CHAPTER 26 · THE 9:47 AM SLACK</text>
  <text x="80" y="118" fill="#FAFAF7" font-size="50" font-weight="500" font-family="Source Serif 4, Georgia, serif" letter-spacing="-1">Twelve people, five reactions</text>
  <text x="80" y="154" fill="#AAA79A" font-size="18">9:03 the briefing skill ships to twelve. By 9:47 the rollout has already split 4-3-2-2-1 — before anyone read the docs.</text>
  <text x="1520" y="60" fill="#71717A" font-size="11" letter-spacing="3" text-anchor="end">#sales-floor · 9:47 AM</text>

  <!-- Slack message card -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="900" height="620" fill="#14181C" stroke="#2A3138" stroke-width="1" rx="10"/>
    <rect x="0" y="0" width="900" height="44" fill="#1A1F24" rx="10"/>
    <rect x="0" y="22" width="900" height="22" fill="#1A1F24"/>
    <text x="28" y="28" fill="#AAA79A" font-size="14" font-family="JetBrains Mono, monospace"># sales-floor</text>
    <text x="872" y="28" fill="#71717A" font-size="13" text-anchor="end">12 members</text>

    <!-- the announcement -->
    <rect x="28" y="68" width="40" height="40" rx="8" fill="#FF6B2C"/>
    <text x="48" y="95" fill="#0E0F11" font-size="18" font-weight="700" text-anchor="middle" font-family="Source Serif 4, Georgia, serif">V</text>
    <text x="84" y="86" fill="#FAFAF7" font-size="16" font-weight="600">Operator</text>
    <text x="188" y="86" fill="#71717A" font-size="13">9:03 AM</text>
    <text x="84" y="112" fill="#E5E5E5" font-size="15">New: the morning-briefing skill is live for everyone. One command,</text>
    <text x="84" y="136" fill="#E5E5E5" font-size="15">your pipeline + calendar + the 3 things that matter today. Try it.</text>
    <text x="84" y="160" fill="#71717A" font-size="14" font-family="JetBrains Mono, monospace">/morning-briefing</text>

    <!-- reaction pills -->
    <g transform="translate(84, 184)">
      <rect x="0" y="0" width="120" height="34" rx="17" fill="#161B1F" stroke="#6EE7B7" stroke-width="1"/>
      <text x="18" y="22" fill="#6EE7B7" font-size="13" font-weight="600">hand-raise</text>
      <text x="98" y="22" fill="#FAFAF7" font-size="13" font-weight="700">4</text>

      <rect x="132" y="0" width="110" height="34" rx="17" fill="#161B1F" stroke="#2A3138" stroke-width="1"/>
      <text x="150" y="22" fill="#AAA79A" font-size="13" font-weight="600">question</text>
      <text x="222" y="22" fill="#FAFAF7" font-size="13" font-weight="700">3</text>

      <rect x="254" y="0" width="184" height="34" rx="17" fill="#161B1F" stroke="#2A3138" stroke-width="1"/>
      <text x="274" y="22" fill="#AAA79A" font-size="13" font-weight="600">thoughtful-pause</text>
      <text x="416" y="22" fill="#FAFAF7" font-size="13" font-weight="700">2</text>
    </g>

    <line x1="28" y1="252" x2="872" y2="252" stroke="#1A1F24" stroke-width="1"/>

    <!-- thread replies -->
    <text x="28" y="284" fill="#71717A" font-size="13" letter-spacing="1">3 REPLIES · THE QUESTION-MARKS</text>
    <g font-size="14.5">
      <circle cx="44" cy="312" r="14" fill="#2A3138"/><text x="44" y="317" fill="#AAA79A" font-size="12" text-anchor="middle">SM</text>
      <text x="70" y="310" fill="#FAFAF7" font-size="13" font-weight="600">Finance</text><text x="150" y="310" fill="#71717A" font-size="12">9:21</text>
      <text x="70" y="332" fill="#E5E5E5">wait, where do I type the command?</text>

      <circle cx="44" cy="362" r="14" fill="#2A3138"/><text x="44" y="367" fill="#AAA79A" font-size="12" text-anchor="middle">JA</text>
      <text x="70" y="360" fill="#FAFAF7" font-size="13" font-weight="600">John A.</text><text x="142" y="360" fill="#71717A" font-size="12">9:34</text>
      <text x="70" y="382" fill="#E5E5E5">is this the thing from the email? do I need to install anything</text>

      <circle cx="44" cy="412" r="14" fill="#2A3138"/><text x="44" y="417" fill="#AAA79A" font-size="12" text-anchor="middle">RT</text>
      <text x="70" y="410" fill="#FAFAF7" font-size="13" font-weight="600">Rob T.</text><text x="138" y="410" fill="#71717A" font-size="12">9:41</text>
      <text x="70" y="432" fill="#E5E5E5">can someone screen-share at standup</text>
    </g>

    <line x1="28" y1="464" x2="872" y2="464" stroke="#1A1F24" stroke-width="1"/>

    <!-- the DM -->
    <text x="28" y="496" fill="#71717A" font-size="13" letter-spacing="1">DIRECT MESSAGE · 9:46</text>
    <rect x="28" y="510" width="844" height="80" rx="8" fill="#1A1208" stroke="#FF6B2C" stroke-width="1"/>
    <circle cx="62" cy="550" r="16" fill="#FF6B2C"/><text x="62" y="555" fill="#0E0F11" font-size="13" font-weight="700" text-anchor="middle">DK</text>
    <text x="90" y="544" fill="#FAFAF7" font-size="14" font-weight="600">Dana K.</text>
    <text x="90" y="568" fill="#FAFAF7" font-size="15">"I think I broke it — I pasted ~800 lines of prospect notes into the CLAUDE.md"</text>
  </g>

  <!-- 4-3-2-2-1 distribution panel -->
  <g transform="translate(1020, 200)">
    <rect x="0" y="0" width="500" height="620" fill="#161B1F" stroke="#2A3138" stroke-width="1" rx="10"/>
    <text x="28" y="48" fill="#6EE7B7" font-size="12" letter-spacing="2.4" font-weight="600">THE 4-3-2-2-1 DISTRIBUTION</text>
    <text x="28" y="74" fill="#71717A" font-size="13">Twelve people. You see it before you read it.</text>

    <g transform="translate(28, 100)">
      <rect x="0" y="0" width="444" height="86" rx="8" fill="#0F1A14" stroke="#6EE7B7" stroke-width="1"/>
      <text x="20" y="36" fill="#6EE7B7" font-size="30" font-weight="500" font-family="Source Serif 4, Georgia, serif">4</text>
      <text x="64" y="32" fill="#FAFAF7" font-size="16" font-weight="600">using it</text>
      <text x="64" y="58" fill="#AAA79A" font-size="13">ran it, hand-raise reaction, already looping</text>

      <rect x="0" y="98" width="444" height="86" rx="8" fill="#161B1F" stroke="#FF8E54" stroke-width="1"/>
      <text x="20" y="134" fill="#FF8E54" font-size="30" font-weight="500" font-family="Source Serif 4, Georgia, serif">3</text>
      <text x="64" y="130" fill="#FAFAF7" font-size="16" font-weight="600">asking the 4 for help</text>
      <text x="64" y="156" fill="#AAA79A" font-size="13">question-marks in thread, wants a demo</text>

      <rect x="0" y="196" width="444" height="86" rx="8" fill="#161B1F" stroke="#2A3138" stroke-width="1"/>
      <text x="20" y="232" fill="#71717A" font-size="30" font-weight="500" font-family="Source Serif 4, Georgia, serif">2</text>
      <text x="64" y="228" fill="#FAFAF7" font-size="16" font-weight="600">pretending it isn't there</text>
      <text x="64" y="254" fill="#AAA79A" font-size="13">thoughtful-pause emoji, then silence</text>

      <rect x="0" y="294" width="444" height="86" rx="8" fill="#161B1F" stroke="#2A3138" stroke-width="1"/>
      <text x="20" y="330" fill="#71717A" font-size="30" font-weight="500" font-family="Source Serif 4, Georgia, serif">2</text>
      <text x="64" y="326" fill="#FAFAF7" font-size="16" font-weight="600">"just send me the briefing"</text>
      <text x="64" y="352" fill="#AAA79A" font-size="13">emailed instead — radio-silent inboxes</text>

      <rect x="0" y="392" width="444" height="86" rx="8" fill="#1A1208" stroke="#FF6B2C" stroke-width="1"/>
      <text x="20" y="428" fill="#FF6B2C" font-size="30" font-weight="500" font-family="Source Serif 4, Georgia, serif">1</text>
      <text x="64" y="424" fill="#FAFAF7" font-size="16" font-weight="600">already broke it</text>
      <text x="64" y="450" fill="#AAA79A" font-size="13">pasted 800 lines into CLAUDE.md, the DM</text>
    </g>
  </g>

  <text x="80" y="866" fill="#71717A" font-size="13">The early adopter is your worst onboarding partner. Adoption isn't a training problem — it's a gravity problem.</text>
</svg>
