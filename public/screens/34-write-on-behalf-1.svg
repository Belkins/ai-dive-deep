<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>
  <text x="80" y="60" fill="#FF6B2C" font-size="15" letter-spacing="6" font-weight="500">CHAPTER 34 · THE GATE, NOT THE OUTPUT</text>
  <text x="80" y="118" fill="#FAFAF7" font-size="50" font-weight="500" font-family="Source Serif 4, Georgia, serif" letter-spacing="-1">The 9:14 AM approval flow</text>
  <text x="80" y="154" fill="#AAA79A" font-size="18">The persona agent drafts, then waits. Six minutes later a human reads it and types "yes." The wait is the product.</text>
  <text x="1520" y="60" fill="#71717A" font-size="11" letter-spacing="3" text-anchor="end">#vlad-drafts · vlad-voice-async</text>

  <!-- DM thread -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="980" height="620" fill="#14181C" stroke="#2A3138" stroke-width="1" rx="10"/>
    <rect x="0" y="0" width="980" height="44" fill="#1A1F24" rx="10"/>
    <rect x="0" y="22" width="980" height="22" fill="#1A1F24"/>
    <text x="24" y="28" fill="#AAA79A" font-size="14" font-family="JetBrains Mono, monospace"># vlad-drafts · only Vlad sees this</text>

    <!-- step 1: draft -->
    <text x="28" y="80" fill="#71717A" font-size="11" letter-spacing="2" font-weight="600">9:08 AM · STEP 1 — DRAFT</text>
    <rect x="28" y="92" width="700" height="150" fill="#0F1A14" stroke="#6EE7B7" stroke-width="1" rx="10"/>
    <text x="48" y="120" fill="#6EE7B7" font-size="13" font-weight="600">vlad-voice-async</text>
    <text x="48" y="148" fill="#E5E5E5" font-size="14">Drafted a 90-word reply to the 12-message thread in</text>
    <text x="48" y="170" fill="#E5E5E5" font-size="14">#leadership-folderly, in your voice. Proposed destination:</text>
    <text x="48" y="192" fill="#FAFAF7" font-size="14" font-family="JetBrains Mono, monospace">#leadership-folderly</text>
    <text x="48" y="222" fill="#71717A" font-size="13">🔗 trigger thread   ·   draft attached</text>
    <!-- gate buttons -->
    <rect x="748" y="92" width="204" height="150" fill="#161B1F" stroke="#2A3138" stroke-width="1" rx="10"/>
    <text x="768" y="120" fill="#71717A" font-size="11" letter-spacing="2" font-weight="600">THE GATE</text>
    <rect x="768" y="136" width="164" height="34" rx="6" fill="#0F1A14" stroke="#6EE7B7" stroke-width="1"/>
    <text x="850" y="158" fill="#6EE7B7" font-size="14" text-anchor="middle" font-weight="600">Approve</text>
    <rect x="768" y="176" width="164" height="30" rx="6" fill="#161B1F" stroke="#2A3138" stroke-width="1"/>
    <text x="850" y="196" fill="#AAA79A" font-size="13" text-anchor="middle">Edit</text>
    <rect x="768" y="210" width="164" height="30" rx="6" fill="#161B1F" stroke="#2A3138" stroke-width="1"/>
    <text x="850" y="230" fill="#AAA79A" font-size="13" text-anchor="middle">Reject</text>

    <!-- step 2: the wait -->
    <text x="28" y="288" fill="#71717A" font-size="11" letter-spacing="2" font-weight="600">STEP 2 — THE WAIT (the whole point)</text>
    <rect x="28" y="300" width="924" height="70" fill="#1A1208" stroke="#FF8E54" stroke-width="1" rx="10"/>
    <text x="48" y="332" fill="#FF8E54" font-size="15" font-weight="600">⏳ 6 minutes</text>
    <text x="170" y="332" fill="#AAA79A" font-size="14">9:08 → 9:14. The agent does not post. It waits for a human.</text>
    <text x="48" y="356" fill="#71717A" font-size="13">No auto-post. The version that skipped this step is the disaster two weeks ago.</text>

    <!-- step 3: yes -->
    <text x="28" y="416" fill="#71717A" font-size="11" letter-spacing="2" font-weight="600">9:14 AM · STEP 3 — APPROVE</text>
    <rect x="560" y="428" width="392" height="64" fill="#1A1208" rx="10"/>
    <text x="932" y="454" fill="#FF6B2C" font-size="11" letter-spacing="2" font-weight="600" text-anchor="end">VLAD</text>
    <text x="582" y="468" fill="#FAFAF7" font-size="18" font-weight="600">yes</text>
    <text x="582" y="486" fill="#71717A" font-size="12">six seconds of reading</text>

    <!-- step 4: posted -->
    <text x="28" y="540" fill="#71717A" font-size="11" letter-spacing="2" font-weight="600">STEP 4 — POSTED AS VLAD</text>
    <rect x="28" y="552" width="924" height="50" fill="#0F1A14" stroke="#6EE7B7" stroke-width="1" rx="10"/>
    <text x="48" y="582" fill="#6EE7B7" font-size="15">✓ Posted to #leadership-folderly as Vlad · total elapsed 11 min</text>
  </g>

  <!-- stats -->
  <g transform="translate(1100, 200)">
    <rect x="0" y="0" width="420" height="620" fill="#161B1F" stroke="#2A3138" stroke-width="1" rx="10"/>
    <text x="28" y="48" fill="#6EE7B7" font-size="12" letter-spacing="2.4" font-weight="600">THE LOOP, BY THE NUMBERS</text>
    <text x="28" y="98" fill="#FAFAF7" font-size="30" font-weight="500" font-family="Source Serif 4, Georgia, serif">~60</text>
    <text x="28" y="122" fill="#71717A" font-size="13">drafts land in #vlad-drafts / week</text>
    <text x="28" y="174" fill="#FAFAF7" font-size="30" font-weight="500" font-family="Source Serif 4, Georgia, serif">~70%</text>
    <text x="28" y="198" fill="#71717A" font-size="13">approved first pass (a 'yes')</text>
    <text x="28" y="250" fill="#FAFAF7" font-size="30" font-weight="500" font-family="Source Serif 4, Georgia, serif">~20%</text>
    <text x="28" y="274" fill="#71717A" font-size="13">edited (12–30 s of typing)</text>
    <text x="28" y="326" fill="#FAFAF7" font-size="30" font-weight="500" font-family="Source Serif 4, Georgia, serif">~10%</text>
    <text x="28" y="350" fill="#71717A" font-size="13">rejected outright</text>
    <text x="28" y="402" fill="#FAFAF7" font-size="30" font-weight="500" font-family="Source Serif 4, Georgia, serif">6–9 min</text>
    <text x="28" y="426" fill="#71717A" font-size="13">median time-to-approval</text>
    <line x1="28" y1="466" x2="392" y2="466" stroke="#2A3138" stroke-width="1"/>
    <text x="28" y="504" fill="#FF6B2C" font-size="12" letter-spacing="2" font-weight="600">THE NEVER</text>
    <text x="28" y="536" fill="#AAA79A" font-size="14">The agent never posts</text>
    <text x="28" y="558" fill="#AAA79A" font-size="14">without the gate. Two weeks</text>
    <text x="28" y="580" fill="#AAA79A" font-size="14">ago, one that did, did damage.</text>
  </g>

  <text x="80" y="866" fill="#71717A" font-size="13">Show the gate, not just the polished draft. The value isn't the writing — it's the explicit human "yes" in the loop.</text>
</svg>
