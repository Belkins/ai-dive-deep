<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1600" height="900" fill="#0E0F11"/>
  <text x="80.0" y="84.0" fill="#F4F1EA" font-size="50" font-weight="700" text-anchor="start">One morning with the first real caller</text>
  <text x="80.0" y="134.0" fill="#9A9789" font-size="26" font-weight="400" text-anchor="start">Calls, callbacks and deploys on 29 Sep 2026, UTC. Six deploys between 10:29 and 11:28.</text>
  <line x1="225" y1="250" x2="1540" y2="250" stroke="#3A3933" stroke-width="2"/>
  <text x="80.0" y="258.0" fill="#9A9789" font-size="24" font-weight="600" text-anchor="start">Phone line</text>
  <line x1="225" y1="450" x2="1540" y2="450" stroke="#3A3933" stroke-width="2"/>
  <text x="80.0" y="458.0" fill="#9A9789" font-size="24" font-weight="600" text-anchor="start">Callbacks</text>
  <line x1="225" y1="650" x2="1540" y2="650" stroke="#3A3933" stroke-width="2"/>
  <text x="80.0" y="658.0" fill="#9A9789" font-size="24" font-weight="600" text-anchor="start">Deploys</text>
  <line x1="307.2" y1="200" x2="307.2" y2="770" stroke="#16171B" stroke-width="2"/>
  <text x="307.2" y="806.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="middle">10:20</text>
  <line x1="471.6" y1="200" x2="471.6" y2="770" stroke="#16171B" stroke-width="2"/>
  <text x="471.6" y="806.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="middle">10:30</text>
  <line x1="635.9" y1="200" x2="635.9" y2="770" stroke="#16171B" stroke-width="2"/>
  <text x="635.9" y="806.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="middle">10:40</text>
  <line x1="800.3" y1="200" x2="800.3" y2="770" stroke="#16171B" stroke-width="2"/>
  <text x="800.3" y="806.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="middle">10:50</text>
  <line x1="964.7" y1="200" x2="964.7" y2="770" stroke="#16171B" stroke-width="2"/>
  <text x="964.7" y="806.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="middle">11:00</text>
  <line x1="1129.1" y1="200" x2="1129.1" y2="770" stroke="#16171B" stroke-width="2"/>
  <text x="1129.1" y="806.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="middle">11:10</text>
  <line x1="1293.4" y1="200" x2="1293.4" y2="770" stroke="#16171B" stroke-width="2"/>
  <text x="1293.4" y="806.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="middle">11:20</text>
  <line x1="1457.8" y1="200" x2="1457.8" y2="770" stroke="#16171B" stroke-width="2"/>
  <text x="1457.8" y="806.0" fill="#9A9789" font-size="21" font-weight="400" text-anchor="middle">11:30</text>
  <circle cx="312.4" cy="250" r="13" fill="#0E0F11" stroke="#FF6B2C" stroke-width="4"/>
  <path d="M306.4 244 L318.4 256 M318.4 244 L306.4 256" stroke="#FF6B2C" stroke-width="3"/>
  <text x="304.4" y="188.0" fill="#FF6B2C" font-size="23" font-weight="700" text-anchor="start">Try 1: cut off at intake</text>
  <text x="304.4" y="298.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">spelled email came</text>
  <text x="304.4" y="324.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">back with a space</text>
  <rect x="499.8" y="236" width="98.6" height="28" rx="6" fill="#C9C3B3"/>
  <text x="499.8" y="222.0" fill="#F4F1EA" font-size="23" font-weight="700" text-anchor="start">Try 2: 73.8</text>
  <text x="499.8" y="298.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">Northstar, 6 min</text>
  <rect x="674.8" y="236" width="111.8" height="28" rx="6" fill="#C9C3B3"/>
  <text x="674.8" y="222.0" fill="#F4F1EA" font-size="23" font-weight="700" text-anchor="start">Try 3: 75.4</text>
  <text x="674.8" y="298.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">Cedar, 6.8 min</text>
  <circle cx="517.0" cy="450" r="13" fill="#0E0F11" stroke="#FF6B2C" stroke-width="4"/>
  <path d="M511.0 444 L523.0 456 M523.0 444 L511.0 456" stroke="#FF6B2C" stroke-width="3"/>
  <text x="493.0" y="422.0" fill="#FF6B2C" font-size="23" font-weight="700" text-anchor="end">#1 fails in 3.5 s</text>
  <text x="493.0" y="498.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="end">no reason</text>
  <text x="493.0" y="524.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="end">recorded</text>
  <circle cx="578.4" cy="450" r="13" fill="#0E0F11" stroke="#FF6B2C" stroke-width="4"/>
  <path d="M572.4 444 L584.4 456 M584.4 444 L572.4 456" stroke="#FF6B2C" stroke-width="3"/>
  <text x="602.4" y="422.0" fill="#FF6B2C" font-size="23" font-weight="700" text-anchor="start">#2 fails in 2 s</text>
  <text x="602.4" y="498.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">carrier: busy</text>
  <text x="602.4" y="524.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">(SIP 486)</text>
  <rect x="939.8" y="436" width="87.9" height="28" rx="6" fill="#22D3A0"/>
  <text x="939.8" y="422.0" fill="#F4F1EA" font-size="23" font-weight="700" text-anchor="start">#3 connects: 68.1</text>
  <text x="939.8" y="498.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">same number, no dial-path change,</text>
  <text x="939.8" y="524.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">5.4 min, completed</text>
  <rect x="461.5" y="643" width="14" height="14" rx="2" fill="#F4F1EA" transform="rotate(45 468.5 650)"/>
  <text x="460.5" y="694.0" fill="#F4F1EA" font-size="20" font-weight="400" text-anchor="start">10:29 spoken-email fix</text>
  <rect x="504.0" y="643" width="14" height="14" rx="2" fill="#F4F1EA" transform="rotate(45 511.0 650)"/>
  <text x="503.0" y="721.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">10:32 callbacks public</text>
  <rect x="542.4" y="643" width="14" height="14" rx="2" fill="#F4F1EA" transform="rotate(45 549.4 650)"/>
  <text x="541.4" y="748.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">10:34 log carrier codes</text>
  <rect x="927.3" y="643" width="14" height="14" rx="2" fill="#F4F1EA" transform="rotate(45 934.3 650)"/>
  <text x="926.3" y="694.0" fill="#F4F1EA" font-size="20" font-weight="400" text-anchor="start">10:58 limit lifted</text>
  <rect x="1030.0" y="643" width="14" height="14" rx="2" fill="#F4F1EA" transform="rotate(45 1037.0 650)"/>
  <text x="1029.0" y="721.0" fill="#9A9789" font-size="20" font-weight="400" text-anchor="start">11:04 limit restored</text>
  <rect x="1428.1" y="643" width="14" height="14" rx="2" fill="#F4F1EA" transform="rotate(45 1435.1 650)"/>
  <text x="1427.1" y="694.0" fill="#F4F1EA" font-size="20" font-weight="400" text-anchor="start">11:28 fair retakes,</text>
  <text x="1427.1" y="721.0" fill="#F4F1EA" font-size="20" font-weight="400" text-anchor="start">contest capacity</text>
  <text x="80.0" y="872.0" fill="#56544B" font-size="20" font-weight="400" text-anchor="start">Bars are the recorded call length; scores are the live grader's. All three callbacks went to the same mobile.</text>
</svg>
